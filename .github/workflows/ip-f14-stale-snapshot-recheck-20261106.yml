name: F14 stale exact-viewer snapshot revalidation source-only OFF
on:
  push:
    branches: [research/cs01-f14-stale-snapshot-handoff-failclosed-off-20261106]
  pull_request:
    branches: [research/cs01-f14-known-pair-readonly-snapshot-off-20261106]
permissions:
  contents: read
jobs:
  stale-snapshot-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard FIVE review paths and preserve original ledger and all runtime systems
        shell: bash
        run: |
          set -euo pipefail
          parent=03332da2fbc3e0968a6fe490b67d80a9514bb8f1
          git merge-base --is-ancestor "$parent" HEAD
          git diff --check "$parent"
          git diff --name-only "$parent" HEAD | sort >/tmp/actual
          printf '%s\n' 'src/IndividualProgressionF14StaleSnapshotRecheckGuard.h' 'tests/f14_stale_snapshot_recheck_model.cpp' '.github/workflows/ip-f14-stale-snapshot-recheck-20261106.yml' 'docs/F14_STALE_SNAPSHOT_RECHECK_2026-11-06.md' 'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$parent" HEAD -- src/IndividualProgressionF14ViewerRestoreProtocol.h src/IndividualProgressionF14PriorHiddenLedger.h src/IndividualProgressionF14GuidSendAttemptEvidence.h src/IndividualProgressionF14ExactViewerRestoreRecheckPlan.h src/IndividualProgressionF14LifecycleScript.cpp src/IndividualProgressionPlayer.cpp conf sql data optional)"
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' conf/individualProgression.conf.dist
          ! grep -Rqs 'OnF14ShouldSuppressCreatureForViewer(' src
          grep -Fq 'constexpr bool MayDispatchCoreDirectly() { return false; }' src/IndividualProgressionF14StaleSnapshotRecheckGuard.h
          grep -Fq 'constexpr bool GuaranteesOwningMapThread() { return false; }' src/IndividualProgressionF14StaleSnapshotRecheckGuard.h
          grep -Fq 'constexpr bool CanClearOriginalLedger() { return false; }' src/IndividualProgressionF14StaleSnapshotRecheckGuard.h
          grep -Fq 'constexpr bool HasClientObjectAck() { return false; }' src/IndividualProgressionF14StaleSnapshotRecheckGuard.h
          echo 'PASS: exactly five review paths, original #94/#85/#103 and live gameplay untouched, flags OFF'
      - name: Compile and RUN 65536 stale/current-context cases in EIGHT modes
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            for standard in c++17 c++20; do
              for ndebug in 0 1; do
                flags=()
                if [ "$ndebug" = 1 ]; then flags+=("-DNDEBUG"); fi
                "$compiler" -std="$standard" -Isrc -Wall -Wextra -Werror -pedantic -O2 "${flags[@]}" tests/f14_stale_snapshot_recheck_model.cpp -o /tmp/f14-stale-snapshot
                /tmp/f14-stale-snapshot
              done
            done
          done
          echo 'PASS: 65536 fresh human/map/session/creature facts in EIGHT variants; no stale snapshot accepted; no Core/ACK/ledger-clear'
