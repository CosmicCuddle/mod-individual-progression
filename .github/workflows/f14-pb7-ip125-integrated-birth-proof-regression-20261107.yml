name: Owner F14 PB7 x IP125 composed birth-proof trust firewall (TEST ONLY)

on:
  push:
    branches:
      - research/cs01-f14-pb7-ip125-birth-trust-recheck-20261107
  pull_request:
    branches:
      - research/cs01-f14-pb3-birth-vs-ip124-first-start-firewall-20261107

permissions:
  contents: read

jobs:
  first-birth-not-a-stage-grant:
    name: Actual integrated PB7 + IP125 C++ model, default OFF, no character writes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact owner IP child draft
        uses: actions/checkout@v4
        with:
          path: ip
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout owner Playerbots #7 review integration (NOT merged or newer master)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-playerbots
          ref: 4f6974ecec081c2006df54ff54aa4cc40cb63f55
          path: pb
          persist-credentials: false
      - name: Verify exact pins, child write-set, and no runtime/SQL changes
        shell: bash
        run: |
          set -euo pipefail
          parent=d193365be1066ab60dbf18d60c7284dab1033ad4
          test "$(git -C pb rev-parse HEAD)" = 4f6974ecec081c2006df54ff54aa4cc40cb63f55
          git -C ip merge-base --is-ancestor "$parent" HEAD
          git -C ip diff --check "$parent" HEAD
          git -C ip diff --name-only "$parent" HEAD | sort > /tmp/actual-f14-bridge
          printf '%s\n' '.github/workflows/f14-pb7-ip125-integrated-birth-proof-regression-20261107.yml' | sort > /tmp/expected-f14-bridge
          diff -u /tmp/expected-f14-bridge /tmp/actual-f14-bridge
          test -z "$(git -C ip diff --name-only "$parent" HEAD -- src conf data sql modules)"
          test -f pb/src/Bot/F14NewRandomBotBirthProbe.h
          test -f ip/tests/f14_first_start_eligibility_model.h
          test "$(git -C pb hash-object src/Bot/F14NewRandomBotBirthProbe.h)" = a75869910778532a235cadc54a16100a0363bd4a
          grep -Fqx 'Playerbots.F14TrackNewRandomBotBirth = 0' pb/conf/playerbots.conf.dist
          grep -Fqx 'Playerbots.ResetQuestsPreserveQuestIds =' pb/conf/playerbots.conf.dist
          echo 'PASS PB7 exact reviewed birth header, quest reset still OFF and IP model unchanged'
      - name: Python source guard against converting diagnostic into trusted birth
        run: |
          python3 -B -m unittest discover -s ip/tests -p 'test_f14_pb3_ip124_birth_proof_firewall_source.py' -v
          python3 -B -m unittest discover -s ip/tests -p 'test_f14_first_start_eligibility_source.py' -v
          python3 -B -m unittest discover -s pb/tests -p 'test_f14_new_randombot_birth_probe_source.py' -v
          python3 -B -m unittest discover -s pb/tests -p 'test_f14_holder_retire_source.py' -v
          python3 -B -m unittest discover -s pb/tests -p 'test_f14_earned_marker_reset_source.py' -v
      - name: Compile actual two header implementations under eight C++ variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f14-birth-proof-firewall
          for cc in g++ clang++; do
            for lang in c++17 c++20; do
              for variant in normal ndebug; do
                flags=()
                if [[ "$variant" == ndebug ]]; then flags=(-DNDEBUG); fi
                "$cc" "-std=$lang" -pthread -Wall -Wextra -Werror -pedantic -O2 "${flags[@]}" \
                  -Iip/tests -Ipb/src/Bot \
                  ip/tests/f14_pb3_ip124_birth_proof_firewall.cpp \
                  -o /tmp/f14-birth-proof-firewall/verify
                /tmp/f14-birth-proof-firewall/verify
              done
            done
          done
          echo 'PASS: actual PB7 production diagnostic header + IP125 inherited PURE model; no durable birth, no stage writer'
      - name: Safety confidence boundary
        if: always()
        run: |
          echo 'Source-native pure test only. PB7 header matches PB3 byte-for-byte; PB7 runtime/source workflow tests are checked, but NO Worldserver, MySQL, character stage, quest, paid or gameplay test.'
          echo 'F14 and paid OFF. No owner authorization to convert PB probe to a trusted creation receipt.'
          echo 'No database or client operation; no release, merge, live test or production change.'
