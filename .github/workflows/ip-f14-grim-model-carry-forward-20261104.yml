# Carry forward the exact F14 pure-model blobs from reviewed PR #56,
# on Grim upstream IP sync + F14 stage-floor PR #62. No runtime enablement.
name: F14 Grim model carry-forward PURE OFF NO HOST
on:
  pull_request:
    branches: [work/cs01-f14-verified-rndbot-tbc-floor-20261104]
    paths:
      - ".github/workflows/ip-f14-grim-model-carry-forward-20261104.yml"
      - "src/IndividualProgressionF14ActorCreatureIndex.h"
      - "src/IndividualProgressionF14MultiAttackerPolicy.h"
      - "src/IndividualProgressionF14CombatVisibilityPolicy.h"
      - "src/IndividualProgressionF14RefreshPolicy.h"
      - "tests/f14_actor_creature_index.cpp"
      - "tests/f14_multi_attacker_policy.cpp"
      - "tests/ip_f14_combat_visibility_policy.cpp"
      - "tests/f14_visibility_refresh_policy.cpp"
      - "docs/F14_MULTI_ATTACKER_LIFECYCLE_POLICY_2026-11-03.md"
      - "docs/F14_COMBAT_VISIBILITY_SAFETY_2026-11-03.md"
      - "docs/CUSTOM_MODIFICATIONS_REGISTER.md"
permissions:
  contents: read
jobs:
  verify:
    name: Original F14 policy on Grim sync (${{ matrix.cxx }} ${{ matrix.std }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++17, c++20]
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Audit source ancestry, scope, exact original blobs and OFF configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 42c9a32892740af55a40e076e6381cc879181396 HEAD
          git merge-base --is-ancestor 26d5b7a1de30ad92a595aaf251fc14754cf54f32 HEAD
          git merge-base --is-ancestor a24fd911648816757ee8ddfb9787173bc6883878 HEAD
          git diff --name-only a24fd911648816757ee8ddfb9787173bc6883878 HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ip-f14-grim-model-carry-forward-20261104.yml' \
            'src/IndividualProgressionF14ActorCreatureIndex.h' \
            'src/IndividualProgressionF14MultiAttackerPolicy.h' \
            'src/IndividualProgressionF14CombatVisibilityPolicy.h' \
            'src/IndividualProgressionF14RefreshPolicy.h' \
            'tests/f14_actor_creature_index.cpp' \
            'tests/f14_multi_attacker_policy.cpp' \
            'tests/ip_f14_combat_visibility_policy.cpp' \
            'tests/f14_visibility_refresh_policy.cpp' \
            'docs/F14_MULTI_ATTACKER_LIFECYCLE_POLICY_2026-11-03.md' \
            'docs/F14_COMBAT_VISIBILITY_SAFETY_2026-11-03.md' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/actual
          git diff --check a24fd911648816757ee8ddfb9787173bc6883878 HEAD
          while read -r path sha; do
            test "$(git rev-parse HEAD:"$path")" = "$sha"
          done <<'BLOBS'
          src/IndividualProgressionF14ActorCreatureIndex.h b61a736e31e4c819264c9d137cbf5a4915825479
          src/IndividualProgressionF14MultiAttackerPolicy.h 94d8efb4fe840170332d0062378d942c5d87dff1
          src/IndividualProgressionF14CombatVisibilityPolicy.h 473909e9f6b1b8fee55af7f87da98529400677ec
          src/IndividualProgressionF14RefreshPolicy.h 6a57eed2ea38ea8551735d2be2551d29a6689618
          tests/f14_actor_creature_index.cpp bd69ea1e21c62c123c501c11930fe4e4e7c3dd37
          tests/f14_multi_attacker_policy.cpp de8e09097c55c255138fe7f43271286b94819040
          tests/ip_f14_combat_visibility_policy.cpp b91041a86e829ac9945d935475604fc2db2755f7
          tests/f14_visibility_refresh_policy.cpp 525da5bd643a2ea0ca81385b7a5ac045be8ddfe3
          docs/F14_MULTI_ATTACKER_LIFECYCLE_POLICY_2026-11-03.md 20c8f7e9375a616fb4515040d04c9b1889476c7f
          docs/F14_COMBAT_VISIBILITY_SAFETY_2026-11-03.md 3b3fdbbbf771d9817d8cfc5b01ce98ca752cff1a
          BLOBS
          grep -Fqx 'IndividualProgression.F14.ForceVerifiedRandomBotTbcFloorOnLogin = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.ProfessionTierCap = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.AutoAttune = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' conf/individualProgression.conf.dist
          echo 'PASS: exact F14 #56 models; Grim+Cosmic runtime untouched; feature OFF'
      - name: Compile and run four exact original F14 offline C++ policy models
        shell: bash
        run: |
          set -euo pipefail
          for model in f14_multi_attacker_policy f14_actor_creature_index ip_f14_combat_visibility_policy f14_visibility_refresh_policy; do
            "${{ matrix.cxx }}" "-std=${{ matrix.std }}" -O2 -DNDEBUG \
              -Wall -Wextra -Werror -pedantic -I. -Isrc \
              "tests/$model.cpp" -o "/tmp/f14-$model"
            "/tmp/f14-$model"
          done
          echo 'PASS: original F14 policies on current Grim sync'
      - name: Clarify boundaries
        if: always()
        run: |
          echo 'Models only: NO runtime actor/world/WHO/corpse/loot/quest/refresh hook.'
          echo 'No source Core, PB, Naxx, Services, SQL, DBC or owner host change.'
