name: F14 current Core viewer session model
on:
  push:
    branches:
      - feature/cs01-ip152-current-core-lifecycle-observer-20261112
  pull_request:
    paths:
      - src/IndividualProgressionF14CurrentViewerSession.h
      - src/IndividualProgressionF14CurrentCoreLifecycle.cpp
      - tests/f14_current_viewer_session_test.cpp
      - .github/workflows/f14-current-core-viewer-session.yml
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Execute current viewer state tests and compile default-OFF translation unit
        run: |
          set -euo pipefail
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -pthread "${extra[@]}" -Isrc tests/f14_current_viewer_session_test.cpp -o /tmp/f14-session
            /tmp/f14-session
            ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror "${extra[@]}" -c src/IndividualProgressionF14CurrentCoreLifecycle.cpp -o /tmp/f14-session-off.o
          done
