# F14 source-only: strict three-patch Core application and IP optional event checks.
# No compilation, server launch, database, client, deployment, config or host access.
name: F14 attack/corpse Core bridge exact source (NO HOST)

on:
  push:
    branches:
      - research/cs01-f14-attack-corpse-event-bridge-20261103
    paths:
      - "src/IndividualProgression.cpp"
      - "src/IndividualProgression.h"
      - "src/IndividualProgressionPlayer.cpp"
      - "tests/core_patches/f14_attack_corpse_event_bridge_prototype.patch"
      - "tests/test_ip_f14_attack_corpse_bridge.py"
      - "tests/test_ip_f14_login_incarnation_token.py"
      - "src/IndividualProgressionF14MultiAttackerPolicy.h"
      - "tests/f14_multi_attacker_policy.cpp"
      - "tests/test_ip_f14_core_observer_seam_prototype.py"
      - "tests/test_ip_f19_login_floor_source.py"
      - "tests/test_ip_combined_c3_f14_partial_login.py"
      - ".github/workflows/ip-f14-attack-corpse-bridge-source-20261103.yml"
  pull_request:
    branches:
      - research/cs01-f14-visibility-refresh-epoch-model-20261103
    paths:
      - "src/IndividualProgression.cpp"
      - "src/IndividualProgression.h"
      - "src/IndividualProgressionPlayer.cpp"
      - "tests/core_patches/f14_attack_corpse_event_bridge_prototype.patch"
      - "tests/test_ip_f14_attack_corpse_bridge.py"
      - "tests/test_ip_f14_login_incarnation_token.py"
      - "src/IndividualProgressionF14MultiAttackerPolicy.h"
      - "tests/f14_multi_attacker_policy.cpp"
      - ".github/workflows/ip-f14-attack-corpse-bridge-source-20261103.yml"

permissions:
  contents: read

jobs:
  strict-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ip
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout historical pinned Core, runner-only
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: core
          persist-credentials: false
      - name: Confirm parent ownership and isolate all runtime source edits
        shell: bash
        run: |
          set -euo pipefail
          git -C ip merge-base --is-ancestor 9962ab8cb009c23d99b457d8ded618828be12a78 HEAD
          git -C ip diff --name-only 9962ab8cb009c23d99b457d8ded618828be12a78 HEAD -- src conf sql data optional | sort >/tmp/f14-ip-actual.txt
          printf '%s\n' src/IndividualProgression.cpp src/IndividualProgression.h src/IndividualProgressionPlayer.cpp src/IndividualProgressionF14MultiAttackerPolicy.h | sort >/tmp/f14-ip-expected.txt
          diff -u /tmp/f14-ip-expected.txt /tmp/f14-ip-actual.txt
          test "$(git -C core rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
      - name: Apply default-allow observer + cached WHO + attack/corpse patches in order
        shell: bash
        run: |
          set -euo pipefail
          for part in \
            f14_observer_visibility_default_allow_prototype.patch \
            f14_who_cached_entry_prototype.patch \
            f14_attack_corpse_event_bridge_prototype.patch
          do
            patch="${{ github.workspace }}/ip/tests/core_patches/$part"
            git -C core apply --check "$patch"
            git -C core apply "$patch"
          done
          git -C core diff --check
          git -C core diff --name-only | sort >/tmp/f14-core-actual.txt
          printf '%s\n' \
            src/server/game/Entities/Object/Object.cpp \
            src/server/game/Entities/Player/Player.cpp \
            src/server/game/Entities/Unit/Unit.cpp \
            src/server/game/Entities/Creature/Creature.cpp \
            src/server/game/Handlers/MiscHandler.cpp \
            src/server/game/Scripting/ScriptMgr.h \
            src/server/game/Scripting/ScriptDefines/WorldObjectScript.h \
            src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp \
            src/server/game/Scripting/ScriptDefines/UnitScript.h \
            src/server/game/Scripting/ScriptDefines/UnitScript.cpp | sort >/tmp/f14-core-expected.txt
          diff -u /tmp/f14-core-expected.txt /tmp/f14-core-actual.txt
      - name: Prove F14 cannot activate from incomplete hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#define COSMIC_F14_OBSERVER_HOOK_VERSION 1' core/src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
          grep -Fq '#define COSMIC_F14_WHO_FILTER_HOOK_VERSION 1' core/src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
          grep -Fq '#define COSMIC_F14_ATTACK_EVENT_HOOK_VERSION 1' core/src/server/game/Scripting/ScriptDefines/UnitScript.h
          ! grep -R --include='*.h' --include='*.cpp' -Fq '#define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' core/src/server/game
          grep -Fq '|| !defined(COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION)' ip/src/IndividualProgression.cpp
          grep -Fq 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' ip/conf/individualProgression.conf.dist
      - name: Real source tests against patched disposable Core
        shell: bash
        env:
          COSMIC_F14_PATCHED_CORE: ${{ github.workspace }}/core
        run: |
          set -euo pipefail
          for t in \
            test_ip_f14_core_observer_seam_prototype.py \
            test_ip_f14_rndbot_player_observer_wiring.py \
            test_ip_f14_who_cache_prototype.py \
            test_ip_f14_attack_corpse_bridge.py \
            test_ip_f14_login_incarnation_token.py \
            test_ip_f19_login_floor_source.py \
            test_ip_combined_c3_f14_partial_login.py
          do
            python3 -B -m unittest discover -s ip/tests -p "$t" -v
          done
      - name: Compile and run pure multi-attacker safety model (GCC/Clang, C++17/C++20)
        shell: bash
        run: |
          set -euo pipefail
          test -s ip/src/IndividualProgressionF14MultiAttackerPolicy.h
          test -s ip/tests/f14_multi_attacker_policy.cpp
          ! grep -RFq --include='*.cpp' 'IndividualProgressionF14MultiAttackerPolicy.h' ip/src
          for compiler in g++ clang++; do
            for standard in c++17 c++20; do
              "$compiler" -std="$standard" -O2 -DNDEBUG \
                -Wall -Wextra -Werror -pedantic -Iip \
                ip/tests/f14_multi_attacker_policy.cpp -o /tmp/f14-multi-attack
              /tmp/f14-multi-attack | tee /tmp/f14-multi-result.txt
              grep -Fqx 'F14 MULTI-ATTACKER 72/72 PASSED; pure/offline model only' /tmp/f14-multi-result.txt
            done
          done
          echo 'Four compile/run combinations passed ONLY the pure candidate policy.'

      - name: Boundary statement
        if: always()
        run: |
          echo 'These are exact-source and runner-only Core patch checks.'
          echo 'PASS DOES NOT prove native Worldserver link, real player combat, WHO visibility, corpse redraw, threat/loot preservation or deployability.'
