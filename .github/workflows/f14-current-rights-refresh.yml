name: F14 current rights-change refresh observer
on:
  push:
    branches:
      - feature/cs01-ip164-f14-current-rights-refresh-20261112
  pull_request:
    paths:
      - src/IndividualProgressionF14CurrentRightsRefresh.h
      - src/IndividualProgressionF14CurrentCoreLifecycle.cpp
      - tests/f14_current_rights_refresh_test.cpp
      - tests/test_f14_current_rights_refresh_source.py
      - docs/CUSTOM_MODIFICATIONS_REGISTER.md
      - .github/workflows/f14-current-rights-refresh.yml
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact current-lineage source boundary
        run: python3 tests/test_f14_current_rights_refresh_source.py
      - name: Compile pure pending model plus inherited safety models
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            for test in f14_current_rights_refresh_test f14_current_combat_ownership_test f14_current_pass_identity_test f14_current_viewer_session_test f14_departure_storage_bridge_test f14_owned_restore_shards_test; do
              ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -pthread "${extra[@]}" -Isrc "tests/$test.cpp" -o "/tmp/$test"
              "/tmp/$test"
            done
          done
          ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -c src/IndividualProgressionF14CurrentCoreLifecycle.cpp -o /tmp/current-off.o