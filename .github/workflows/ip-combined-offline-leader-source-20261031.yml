name: IP combined Hunter+group no-offline-leader stage0 overwrite (source only)

on:
  pull_request:
    paths:
      - src/IndividualProgressionPlayer.cpp
      - docs/IP_COMBINED_HUNTER_GROUP_OFFLINE_LEADER_PORT_2026-10-31.md
      - docs/CUSTOM_MODIFICATIONS_REGISTER.md
      - tests/test_ip_combined_offline_leader_guard.py
      - .github/workflows/ip-combined-offline-leader-source-20261031.yml
      - .github/workflows/ip-hunter-group-integration-review-20261031.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-combined-source-and-policy:
    name: Preserve Hunter, group and F14 source; check missing leader before quest reads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact invoking PR source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict six-file delta vs original combined Hunter/grouping parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=d3688e243a24441438eaff7b3488b05f41614deb
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/ip-combined-offline-leader-source-20261031.yml' \
            '.github/workflows/ip-hunter-group-integration-review-20261031.yml' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'docs/IP_COMBINED_HUNTER_GROUP_OFFLINE_LEADER_PORT_2026-10-31.md' \
            'src/IndividualProgressionPlayer.cpp' \
            'tests/test_ip_combined_offline_leader_guard.py' | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
          # Verify the old exact-path freeze step, not the complete Hunter job,
          # is scoped to #10; all normal Hunter/group regressions must still run.
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/ip-hunter-group-integration-review-20261031.yml').read_text()
          start=src.index('      - name: Assert source equality and exact five-file review delta')
          end=src.index('        shell: bash', start)
          frozen_step=src[start:end]
          assert frozen_step.count('        if: >-')==1, 'Scope only original frozen step'
          assert "github.head_ref == 'integration/hunter-grouping-candidate-20261031'" in frozen_step
          assert "github.ref == 'refs/heads/integration/hunter-grouping-candidate-20261031'" in frozen_step
          start=src.index('  integration-source-and-policy:')
          end=src.index('    steps:', start)
          assert '    if:' not in src[start:end], 'Do not skip all Hunter regressions'
          assert 'python3 tests/check_hunter_autocast_source.py' in src
          assert 'python3 tests/check_group_expansion_source.py' in src
          PY
          for file in src/cs_individualProgression.cpp src/IndividualProgressionGroupPolicy.h src/IndividualProgression.cpp src/IndividualProgressionSpells.cpp; do
            test "$(git rev-parse "HEAD:$file")" = "$(git rev-parse "$BASE:$file")"
          done
          test "$(git rev-parse HEAD:src/IndividualProgressionSpells.cpp)" = 6ee93e1174b5aef6c5d61c9ea31526506c9d08da
          test "$(git rev-parse HEAD:src/IndividualProgression.cpp)" = 625817c67f70be65eb3a9462199c0228e378c605
          test "$(git rev-parse HEAD:src/IndividualProgressionGroupPolicy.h)" = 3b7cf2c520137aeeb49dd1e6857614d9bdf63fa0
          echo 'PASS: Hunter, expansion policy, GM and progression engine unchanged'
      - name: Run new offline leader source tests and existing integrated regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ip_combined_offline_leader_guard.py' -v
          python3 tests/check_hunter_autocast_source.py
          python3 tests/check_group_expansion_source.py
      - name: Recheck original pure expansion policy under C++17 and C++20
        shell: bash
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            g++ "-std=$std" -O2 -Wall -Wextra -Werror -pedantic \
              tests/group_expansion_policy.cpp -o "/tmp/group-$std"
            "/tmp/group-$std"
          done
      - name: Source-only safety declaration
        run: |
          echo 'Source/model tests ONLY; new combined login callback still needs native Worldserver compilation and gameplay acceptance.'
          echo 'No game launched, owner source touched, configuration enabled, SQL/characters modified, or code merged.'
