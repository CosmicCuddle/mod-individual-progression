# F14 safer social isolation for verified BE/Draenei RandomBots (default OFF).
# Child of IP #172 (aed05a92). MILESTONE-ONLY: manual dispatch, so ordinary
# pushes spend no Actions quota. No worldserver launch, DB, host or deploy.
name: F14 social isolation (OFF, milestone, NO HOST)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: "Social isolation policy + source contracts (${{ matrix.cxx }} ${{ matrix.std }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Verify #172 ancestry and EXACT twelve-path scope"
        shell: bash
        run: |
          set -euo pipefail
          parent=aed05a92f262362608f5d643c8570b504189aae0
          git merge-base --is-ancestor "$parent" HEAD
          git diff --name-only "$parent" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/f14-social-isolation.yml' \
            'conf/individualProgression.conf.dist' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'docs/F14_SOCIAL_ISOLATION_2026-11-13.md' \
            'docs/F14_SOCIAL_ISOLATION_RUNTIME_TEST_PLAN_2026-11-13.md' \
            'src/IndividualProgression.cpp' \
            'src/IndividualProgression.h' \
            'src/IndividualProgressionF14SocialIsolationPolicy.h' \
            'src/IndividualProgressionF14SocialIsolationScript.cpp' \
            'src/IndividualProgressionPlayer.cpp' \
            'tests/f14_social_isolation_policy_test.cpp' \
            'tests/test_f14_social_isolation_source.py' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/actual
          git diff --check "$parent" HEAD
          git diff -U0 "$parent" HEAD -- docs/CUSTOM_MODIFICATIONS_REGISTER.md \
            | grep -E '^-' | grep -Ev '^--- ' > /tmp/register-removed || true
          test ! -s /tmp/register-removed
      - name: Source contracts
        shell: bash
        run: python3 -B -m unittest discover -s tests -p 'test_f14_social_isolation_source.py' -v
      - name: "Native policy tests (${{ matrix.cxx }} ${{ matrix.std }}, with and without NDEBUG)"
        shell: bash
        run: |
          set -euo pipefail
          for ndebug in "" "-DNDEBUG"; do
            ${{ matrix.cxx }} -std=${{ matrix.std }} -pthread -Wall -Wextra -Werror -pedantic -O2 $ndebug \
              -Isrc tests/f14_social_isolation_policy_test.cpp -o /tmp/f14-social
            /tmp/f14-social | tee /tmp/out.txt
            grep -Eq '^F14 SOCIAL ISOLATION POLICY ([0-9]+)/\1 passed' /tmp/out.txt
          done

  core25-anchors:
    name: "Core25 395b68ee social-hook anchors (read-only)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Core25 (sparse, read-only)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: 395b68ee4ce425826c2a79c0ddf3ade3c67c8160
          path: core
          persist-credentials: false
          sparse-checkout: |
            src/server/game
      - name: Verify hook placement, ordering and /who count consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = 395b68ee4ce425826c2a79c0ddf3ade3c67c8160
          python3 -I - <<'PY'
          from pathlib import Path
          base = Path("core/src/server/game")
          anchors = [
              ("Scripting/ScriptDefines/PlayerScript.h", 149, "PLAYERHOOK_CAN_GROUP_INVITE,"),
              ("Scripting/ScriptDefines/PlayerScript.h", 150, "PLAYERHOOK_CAN_GROUP_ACCEPT,"),
              ("Scripting/ScriptDefines/PlayerScript.h", 200, "PLAYERHOOK_CAN_INIT_TRADE,"),
              ("Scripting/ScriptDefines/PlayerScript.h", 207, "PLAYERHOOK_CAN_PLAYER_USE_PRIVATE_CHAT,"),
              ("Scripting/ScriptDefines/PlayerScript.h", 548, "virtual bool OnPlayerCanGroupInvite(Player* /*player*/, std::string& /*membername*/)"),
              ("Scripting/ScriptDefines/PlayerScript.h", 550, "virtual bool OnPlayerCanGroupAccept(Player* /*player*/, Group* /*group*/)"),
              ("Scripting/ScriptDefines/PlayerScript.h", 674, "virtual bool OnPlayerCanInitTrade(Player* /*player*/, Player* /*target*/)"),
              ("Scripting/ScriptDefines/PlayerScript.h", 718, "std::string& /*msg*/, Player* /*receiver*/)"),
              ("Scripting/ScriptDefines/PlayerScript.cpp", 540, "CALL_ENABLED_BOOLEAN_HOOKS(PlayerScript, PLAYERHOOK_CAN_GROUP_INVITE"),
              ("Entities/Player/Player.cpp", 9684, "void Player::Whisper(std::string_view text, Language language, Player* target"),
              ("Entities/Player/Player.cpp", 9695, "if (!sScriptMgr->OnPlayerCanUseChat(this, CHAT_MSG_WHISPER, language, _text, target))"),
              ("Handlers/ChatHandler.cpp", 428, "SendWrongFactionNotice();"),
              ("Handlers/ChatHandler.cpp", 448, "GetPlayer()->Whisper(msg, Language(lang), receiver);"),
              ("Handlers/TradeHandler.cpp", 830, "info.Status = TRADE_STATUS_WRONG_FACTION;"),
              ("Handlers/TradeHandler.cpp", 842, "if (!sScriptMgr->OnPlayerCanInitTrade(_player, pOther))"),
              ("Handlers/GroupHandler.cpp", 89, "if (!sScriptMgr->OnPlayerCanGroupInvite(invitingPlayer, membername))"),
              ("Handlers/MiscHandler.cpp", 397, "#if defined(COSMIC_F14_WHO_GUID_QUERY_EXPERIMENT) && COSMIC_F14_WHO_GUID_QUERY_EXPERIMENT >= 1"),
              ("Handlers/MiscHandler.cpp", 401, "sScriptMgr->ShouldF14ExcludeWhoEntryForViewer(_player, target.GetGuid(), race))"),
              ("Handlers/MiscHandler.cpp", 407, "if ((matchCount++) >= sWorld->getIntConfig(CONFIG_MAX_WHO_LIST_RETURN))"),
              ("Scripting/ScriptDefines/WorldObjectScript.h", 62, "WORLDOBJECTHOOK_ON_F14_WHO_GUID_EXCLUSION_QUERY,"),
              ("Scripting/ScriptDefines/WorldObjectScript.h", 159, "virtual bool OnF14ShouldExcludeWhoEntryForViewer("),
              ("Chat/Chat.h", 48, "static std::size_t BuildChatPacket(WorldPacket& data, ChatMsg chatType, Language language, WorldObject const* sender, WorldObject const* receiver"),
              # Group-accept member scan (S1): API, in-world lookup and thread context.
              ("Handlers/GroupHandler.cpp", 257, "if (!sScriptMgr->OnPlayerCanGroupAccept(GetPlayer(), group))"),
              ("Groups/Group.h", 183, "ObjectGuid  guid;"),
              ("Groups/Group.h", 252, "MemberSlotList const& GetMemberSlots() const { return m_memberSlots; }"),
              ("Globals/ObjectAccessor.cpp", 269, "Player* ObjectAccessor::FindPlayer(ObjectGuid const guid)"),
              ("Globals/ObjectAccessor.cpp", 272, "return player && player->IsInWorld() ? player : nullptr;"),
              ("Server/Protocol/Opcodes.cpp", 241, "PROCESS_THREADUNSAFE,   &WorldSession::HandleGroupInviteOpcode"),
              ("Server/Protocol/Opcodes.cpp", 245, "PROCESS_THREADUNSAFE,   &WorldSession::HandleGroupAcceptOpcode"),
              ("Server/Protocol/Opcodes.cpp", 280, "PROCESS_THREADUNSAFE,   &WorldSession::HandleMessagechatOpcode"),
              ("Server/Protocol/Opcodes.cpp", 409, "PROCESS_THREADUNSAFE,   &WorldSession::HandleInitiateTradeOpcode"),
              ("Server/WorldSession.cpp", 76, "if (opHandle->ProcessingPlace == PROCESS_THREADUNSAFE)"),
              ("Server/WorldSession.cpp", 77, "return false;"),
              # T1: the world-thread marker hook runs on the world thread, after the map update.
              ("Scripting/ScriptDefines/WorldScript.h", 34, "WORLDHOOK_ON_UPDATE,"),
              ("Scripting/ScriptDefines/WorldScript.h", 71, "virtual void OnUpdate(uint32 /*diff*/) { }"),
              ("World/World.cpp", 1255, "sMapMgr->Update(diff);"),
              ("World/World.cpp", 1356, "sScriptMgr->OnWorldUpdate(diff);"),
              # T1 ownership proof: a player update starts with the before-update hook on the
              # thread updating its map; Playerbots AI runs later in the after-update hook; each
              # map is scheduled once per tick and the world waits for all before the tick ends.
              ("Scripting/ScriptDefines/PlayerScript.h", 59, "PLAYERHOOK_ON_BEFORE_UPDATE,"),
              ("Scripting/ScriptDefines/PlayerScript.h", 306, "virtual void OnPlayerBeforeUpdate(Player* /*player*/, uint32 /*p_time*/) { }"),
              ("Entities/Player/PlayerUpdates.cpp", 60, "sScriptMgr->OnPlayerBeforeUpdate(this, p_time);"),
              ("Entities/Player/PlayerUpdates.cpp", 427, "sScriptMgr->OnPlayerAfterUpdate(this, p_time);"),
              ("Maps/Map.cpp", 489, "player->Update(s_diff);"),
              ("Maps/Map.h", 335, "PlayerList const& GetPlayers() const { return m_mapRefMgr; }"),
              ("Maps/MapMgr.cpp", 274, "m_updater.schedule_update(*iter->second"),
              ("Maps/MapMgr.cpp", 280, "m_updater.wait();"),
          ]
          bad = 0
          for name, line, text in anchors:
              got = (base / name).read_text(encoding="utf-8").split("\n")[line - 1]
              if text not in got:
                  bad += 1
                  print(f"FAIL {name}:{line}: expected {text!r}, got {got!r}")
          if bad:
              raise SystemExit(f"{bad} Core25 social anchor(s) drifted")
          print(f"PASS: {len(anchors)} Core25 social-hook anchors; faction checks precede whisper/trade hooks; /who exclusion precedes matchCount; social opcodes are world-thread only; world-update marker hook; T1 per-tick map ownership")
          PY
