name: IP Hunter + expansion grouping full Worldserver link (isolated only)

on:
  pull_request:
    paths:
      - .github/workflows/ip-hunter-group-combined-pinned-worldserver.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-hunter-group-worldserver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-hunter-group-worldserver:
    name: Pinned Hunter and grouping executable source combined in disposable Worldserver
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout historical Grimfeather AzerothCore compatibility pin
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false

      - name: Checkout historical Playerbots compatibility pin
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false

      - name: Checkout fixed grouping IP source without touching its PR
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: e0cd785f6b2090c8f099c824811077d0ab2a9de5
          path: acore/modules/mod-individual-progression
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Hunter autocast source reference (not installed)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: f0044987cc2d6f0b73c1cd25d17012a26a764beb
          path: hunter-reference
          persist-credentials: false

      - name: Checkout historical Naxxramas module source pin
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Verify five historical source pins and neither PR changed
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = e0cd785f6b2090c8f099c824811077d0ab2a9de5
          test "$(git -C hunter-reference rev-parse HEAD)" = f0044987cc2d6f0b73c1cd25d17012a26a764beb
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9

      - name: Reproduce ONLY two historical Playerbots compatibility edits on disposable runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path("acore/modules/mod-playerbots")
          replacements = {
              "src/Db/PlayerbotsDatabase.h": (
                  "MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,",
                  "MySQLConnection* CreateConnection(ProducerConsumerQueue<SQLOperation*>* queue,"
              ),
              "src/Util/LocaleColumns.h": (
                  "if (!IsLocaleRegistered(locale))",
                  "if (!localeNames[locale])"
              ),
          }
          for relative_path, (old, new) in replacements.items():
              path = module / relative_path
              source = path.read_text(encoding="utf-8")
              assert source.count(old) == 1, f"Expected exact one-line origin not found: {relative_path}"
              assert source.count(new) == 0, f"Unexpected pre-existing change: {relative_path}"
              path.write_text(source.replace(old, new), encoding="utf-8")
              print(f"Applied pinned compatibility one-line change: {relative_path}")
          PY
          git -C acore/modules/mod-playerbots diff --check
          python3 - <<'PY'
          import subprocess
          cwd = "acore/modules/mod-playerbots"
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only"], cwd=cwd, text=True).splitlines())
          assert files == {"src/Db/PlayerbotsDatabase.h", "src/Util/LocaleColumns.h"}, files
          numstat = subprocess.check_output(
              ["git", "diff", "--numstat"], cwd=cwd, text=True).splitlines()
          assert len(numstat) == 2, numstat
          for line in numstat:
              added, removed, _ = line.split("\t", 2)
              assert (added, removed) == ("1", "1"), line
          print("PASS: exactly two 1-line Playerbots edits; no other file changes")
          PY

      - name: Overlay EXACT previously compiled Hunter C++ unit in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          src=hunter-reference/src/IndividualProgressionSpells.cpp
          dest="$ip/src/IndividualProgressionSpells.cpp"
          test "$(git -C hunter-reference rev-parse HEAD:src/IndividualProgressionSpells.cpp)" = 6ee93e1174b5aef6c5d61c9ea31526506c9d08da
          test "$(git -C "$ip" rev-parse HEAD:src/IndividualProgressionSpells.cpp)" = c1aa4fd4f213f48c734eeb778870709604967641
          cp "$src" "$dest"
          test "$(git -C "$ip" hash-object src/IndividualProgressionSpells.cpp)" = 6ee93e1174b5aef6c5d61c9ea31526506c9d08da
          git -C "$ip" diff --check
          git -C "$ip" diff --name-only > /tmp/ip-combined-changes.txt
          printf '%s\n' 'src/IndividualProgressionSpells.cpp' > /tmp/allowed-hunter-overlay.txt
          diff -u /tmp/allowed-hunter-overlay.txt /tmp/ip-combined-changes.txt
          echo 'PASS: grouping PR source preserved; ONLY Hunter implementation unit overlaid from exact compiled reference.'

      - name: Verify group rules integrated with existing GroupScript
        run: python3 acore/modules/mod-individual-progression/tests/check_group_expansion_source.py

      - name: Install compiler dependencies ONLY on disposable runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure full pinned Worldserver
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON

      - name: Require all three IP Hunter/grouping translation units in real compile graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = json.loads(Path("acore-build/compile_commands.json").read_text())
          for source in ("IndividualProgression.cpp", "IndividualProgressionPlayer.cpp", "IndividualProgressionSpells.cpp"):
              found = [entry for entry in commands
                       if entry.get("file", "").replace("\\\\", "/").endswith(
                           "/mod-individual-progression/src/" + source)]
              assert len(found) == 1, f"Required IP translation unit {source}: {len(found)}"
              print(f"PASS: full Worldserver compile graph includes {source}")
          PY

      - name: Compile and link exact Hunter-plus-grouping Worldserver (NEVER LAUNCH)
        run: cmake --build acore-build --target worldserver --parallel 2

      - name: Verify linked executable without uploading or deploying
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          sha256sum "$binary"
          echo "PASS: pinned Hunter autocast executable C++ + exact IP expansion grouping in one Worldserver"
          echo "NOT an owner-installed live binary, current host source, or gameplay acceptance result"

      - name: Preserve safety boundary
        if: always()
        run: |
          echo "This checkout is on a disposable GitHub runner, NOT CosmicCuddle's host."
          echo "Two previously studied Playerbots compatibility edits reproduced on runner only, NOT downloaded from owner host."
          echo "No live Worldserver, SQL, config, DBC, client, backup, merge, or deployment."
          echo "Other installed modules, effective configs, binary provenance and restore readiness remain unverified."
          echo "Owner approval required before any production build, server restart or gameplay test. This build uses *historical* pins, not confirmed current installed SHAs."
          echo "Hunter and grouping are separate unmerged drafts; no SQL, install, Worldserver launch or production patch."
