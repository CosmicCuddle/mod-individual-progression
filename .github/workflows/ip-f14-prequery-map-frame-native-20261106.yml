# Stacked on exact #109 native-green Core/IP/PB/Naxx/Services; #110 adds a real negative F14 pre-query frame veto in disposable Core only.
# Core modifications apply ONLY in disposable CI; no server launch, no positive F14 hide.
name: F14 prequery frame hard veto combined pinned Worldserver (OFF)

on:
  push:
    branches:
      - research/cs01-f14-prequery-map-frame-hard-veto-off-20261106
  pull_request:
    branches:
      - research/cs01-f14-map-frame-native-integration-off-20261106
    paths:
      - '.github/workflows/ip-f14-prequery-map-frame-native-20261106.yml'

permissions:
  contents: read

jobs:
  native-worldserver-link:
    name: "Native Worldserver #110 Core F14 pre-query hard map-frame veto + IP/PB/Naxx/Services (OFF; NO LAUNCH)"
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout Grim Core newer 0d754
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 0d754d1921261dfd939f91060ebc022eae280f71
          path: acore
          persist-credentials: false
      - name: Checkout historical pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact PR head IP source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-individual-progression
          persist-credentials: false
          fetch-depth: 0
      - name: "Checkout untouched Naxx first test candidate #292"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 51d0611476358286505aed3ca806ea250f644f66
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: "Checkout untouched Character Services first test #16"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-character-services
          ref: b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          path: acore/modules/mod-character-services
          persist-credentials: false
      - name: "Checkout ORIGINAL tested F14 #56 prototype patches as read-only source"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          path: f14-original
          persist-credentials: false

      - name: Checkout exact already-green #67 + #70 observer sources (reference only)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 11fd5d64eb2408ff0fe464c72d31ab283e3d51e5
          path: f14-observer
          persist-credentials: false

      - name: Checkout exact #76/#77 Core patch artifacts as read-only input
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 6182893d18e0ab2bb1d581900910346c1c0819b2
          path: f14-core-refresh
          persist-credentials: false

      - name: Checkout exact selected-RNDBOT Playerbots patch layers #49/#74 (READ ONLY)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: feb616e88fe4435edf9b8cb1e140272e5c644112
          path: pb-refinement
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout pinned #95 Core provenance assets (read-only; no runtime source overlay)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 31198448171b8d8a07c432d6361cd57c6c7ba821
          path: f14-create-ref
          persist-credentials: false
      - name: Verify exact pins and OFF defaults
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          test "$(git -C acore rev-parse HEAD)" = 0d754d1921261dfd939f91060ebc022eae280f71
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C "$ip" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          (
            cd "$ip"
          git merge-base --is-ancestor 566c9524f81ca537623a95789568bd8a708a082f HEAD
          git diff --name-only 566c9524f81ca537623a95789568bd8a708a082f HEAD | sort > /tmp/actual
          printf '%s\n' \
            'tests/core_patches/apply_f14_prequery_map_frame_hard_veto.py' \
            'tests/test_ip_f14_prequery_map_frame_hard_veto.py' \
            'tests/f14_prequery_map_frame_hard_veto_model.cpp' \
            '.github/workflows/ip-f14-prequery-map-frame-source-20261106.yml' \
            '.github/workflows/ip-f14-prequery-map-frame-native-20261106.yml' \
            'docs/F14_PREQUERY_MAP_FRAME_HARD_VETO_2026-11-06.md' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check 566c9524f81ca537623a95789568bd8a708a082f
          test -z "$(git diff --name-only 566c9524f81ca537623a95789568bd8a708a082f HEAD -- conf sql data optional)"
          test -z "$(git diff --name-only 566c9524f81ca537623a95789568bd8a708a082f HEAD -- src)"
          # #107-#109 source/observer remains entirely immutable in this child.
          test "$(git rev-parse HEAD:src/IndividualProgression.cpp)" = a8fcf1ba7f50233e460ba897c51447c9a05e0149
          test "$(git rev-parse HEAD:src/IndividualProgression.h)" = 73392659647c51dc18b7c7124bf2d32f4cfde92f
          test "$(git rev-parse HEAD:src/IndividualProgressionPlayer.cpp)" = cf5df36791d03ef0138306683892d0c312987330
          test "$(git rev-parse HEAD:src/cs_individualProgression.cpp)" = dce8e36d5133c0bac5e8b0f269675781dd2776ba
          test "$(git rev-parse HEAD:conf/individualProgression.conf.dist)" = 66d36a2701367a208cb28163288b77c2d7b267d6
          test "$(git rev-parse HEAD:src/IndividualProgressionF14StageFloorPolicy.h)" = bca72e9b0addca276ec77f9c8d4c5e530dabcb17
          test "$(git rev-parse HEAD:tests/f14_stage_floor_policy.cpp)" = b531e9a500addf1c89d8787f950561d2dd8c968d
          test "$(git rev-parse HEAD:tests/test_ip_f14_stage_floor_source.py)" = 225e9b5c83aa487910df62131589d76596622b92
          test "$(git rev-parse HEAD:tests/test_ip_f14_stage_floor_gm_successor.py)" = ee7349c3c6af37ee4030519b160ffa8ade5c9d89
          test "$(git rev-parse HEAD:tests/core_patches/apply_f14_viewer_suppression_attribution.py)" = 8c00f7b557d7c82e2472768f8c35300df6ff0122
          test "$(git rev-parse HEAD:tests/test_ip_f14_viewer_suppression_attribution.py)" = f94f6911052db873e941b74025b90d82c401198d
          test -z "$(git diff --name-only 4ec81739efef98adb6fcdc2fa15a731458bfba04 HEAD -- src/IndividualProgressionF14LifecycleRegistry.h src/IndividualProgressionF14LogoutRefreshQueue.h)"
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotStageFloor = 0' conf/individualProgression.conf.dist
          ! grep -Fq '#define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' src/IndividualProgressionF14LifecycleScript.cpp
          )
          test -s "$ip/src/IndividualProgressionF14LogoutRefreshQueue.h"
          test -s "$ip/tests/f14_logout_refresh_queue.cpp"
          test -s f14-core-refresh/tests/core_patches/f14_event_visibility_refresh_request_prototype.patch
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 51d0611476358286505aed3ca806ea250f644f66
          test "$(git -C acore/modules/mod-character-services rev-parse HEAD)" = b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          test "$(git -C f14-original rev-parse HEAD)" = 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          test "$(git -C f14-observer rev-parse HEAD)" = 11fd5d64eb2408ff0fe464c72d31ab283e3d51e5
          test -s f14-observer/tests/core_patches/f14_visibility_pass_observed_prototype.patch
          test -s f14-observer/tests/test_ip_f14_core_visibility_pass_prototype_source.py
          test -s f14-observer/tests/test_ip_f14_core_refresh_delivery_path.py
          test "$(git -C f14-core-refresh rev-parse HEAD)" = 6182893d18e0ab2bb1d581900910346c1c0819b2
          test "$(git -C pb-refinement rev-parse HEAD)" = feb616e88fe4435edf9b8cb1e140272e5c644112
          test "$(git -C f14-create-ref rev-parse HEAD)" = 31198448171b8d8a07c432d6361cd57c6c7ba821
          test "$(git -C f14-create-ref rev-parse HEAD:tests/core_patches/apply_f14_batched_guid_send_attempt.py)" = 170e624a84cb9d271bd80056dfcaa77ecdaa0324
          test "$(git -C f14-create-ref rev-parse HEAD:tests/core_patches/apply_f14_batched_guid_create_attempt.py)" = dfaf7e6d17a876809570678bbdf6a8891e7441ba
          test "$(git -C f14-create-ref rev-parse HEAD:tests/test_ip_f14_batched_guid_create_attempt_source.py)" = ea09d9f056dcc8bf108e838eaa6f14febb41fbb7
          test "$(git -C pb-refinement rev-parse HEAD:tests/pb_patches/reset_earned_ip_markers_prototype.patch)" = baa179588397461ff8838371b6fdebd874940132
          for key in AutoAttune PaidExpansion.Enable F14.ProtectVerifiedRandomBotStageFloor F14.ProtectVerifiedRandomBotGroupFloor \
                     F14.PreserveVerifiedRandomBotStageOnLogin F14.ForceVerifiedRandomBotTbcFloorOnLogin \
                     F14.ExperimentalRndbotPlayerVisibility F14.ExperimentalAttackLifecycleRegistry; do
            grep -Fqx "IndividualProgression.$key = 0" "$ip/conf/individualProgression.conf.dist"
          done
          grep -Fqx 'CharacterServices.ExpansionUnlock.Enable = 0' acore/modules/mod-character-services/conf/character_services.conf.dist
          echo 'PASS: exact pins; every paid/F14 option OFF'

      - name: Test live-module source tree (stage-3 + guarded one-shot requester)
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_lifecycle_source.py' -v
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_postevent_reveal_request_source.py' -v
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_logout_mapthread_source.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -I"$ip/src" \
            "$ip/tests/f14_logout_refresh_queue.cpp" -o /tmp/f14-logout-native-model
          /tmp/f14-logout-native-model
          grep -Fq 'bool OnF14ShouldRefreshCreatureVisibility(Creature const* creature) override' "$ip/src/IndividualProgressionF14LifecycleScript.cpp"
          echo 'PASS: real IP C++ source guarded; no Runtime/DB feature enabled'

      - name: Test actual integrated IP C++ and source, no runner overlays
        shell: bash
        run: |
          set -euo pipefail
          cd acore/modules/mod-individual-progression
          for name in test_ip_f14_stage_floor_source.py test_ip_f14_stage_floor_gm_successor.py test_ip_f14_lifecycle_source.py test_ip_f14_rights_refresh_source.py test_ip_f14_refresh_poison_status_source.py test_ip_f14_logout_mapthread_source.py test_ip_f14_postevent_reveal_request_source.py; do
            python3 -B -m unittest discover -s tests -p "$name" -v
          done
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              for file in tests/f14_stage_floor_policy.cpp tests/f14_rights_refresh_handoff.cpp tests/f14_logout_refresh_queue.cpp; do
                "$compiler" -std="$std" -Wall -Wextra -Werror -pedantic -O2 -Isrc "$file" -o /tmp/cosmic-integrated-test
                /tmp/cosmic-integrated-test
              done
            done
          done
          echo 'PASS: integrated source was linked without overlays'
      - name: Apply exact two-file Core paid-row safety patch (disposable runner)
        shell: bash
        run: |
          set -euo pipefail
          patch=modules/mod-individual-progression/tests/core_patches/preserve_paid_receipt_row.patch
          test "$(git -C acore rev-parse HEAD:src/server/game/Entities/Player/PlayerSettings.cpp)" = f1eb86367ce69111867ef7187125f5fe456c5367
          test "$(git -C acore rev-parse HEAD:src/server/game/Entities/Player/Player.h)" = 5a29ac7b40ade7a11f1fcf36623dc7530ea39595
          git -C acore apply --check "$patch"
          git -C acore apply "$patch"

      - name: Apply original F14 observer/WHO/attack-corpse Core prototypes (CI ONLY)
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            f14_observer_visibility_default_allow_prototype.patch \
            f14_who_cached_entry_prototype.patch \
            f14_attack_corpse_event_bridge_prototype.patch; do
            original="f14-original/tests/core_patches/$patch"
            test -s "$original"
            patchfile="../$original"
            if [[ "$patch" == f14_attack_corpse_event_bridge_prototype.patch ]]; then
              # Same trailing-context-only adaptation as the parent #64 workflow.
              grep -Fq 'void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)' acore/src/server/game/Entities/Unit/Unit.cpp
              patchfile="$RUNNER_TEMP/f14-newer-grim-attack-context.patch"
              python3 - "$original" "$patchfile" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text()
          old=" void Unit::CombatStop(bool includingCast, bool mutualPvP)\n"
          new=" void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)\n"
          assert src.count(old)==1 and new not in src
          Path(sys.argv[2]).write_text(src.replace(old,new))
          PY
            fi
            git -C acore apply --check "$patchfile"
            git -C acore apply "$patchfile"
          done
          git -C acore diff --check
          git -C acore diff --name-only | sort > /tmp/actual-core
          printf '%s\n' \
            'src/server/game/Scripting/ScriptMgr.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.h' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.cpp' \
            'src/server/game/Entities/Object/Object.cpp' \
            'src/server/game/Entities/Player/Player.cpp' \
            'src/server/game/Entities/Player/Player.h' \
            'src/server/game/Entities/Player/PlayerSettings.cpp' \
            'src/server/game/Entities/Unit/Unit.cpp' \
            'src/server/game/Entities/Creature/Creature.cpp' \
            'src/server/game/Handlers/MiscHandler.cpp' | sort > /tmp/allowed-core
          diff -u /tmp/allowed-core /tmp/actual-core
          grep -Fq '#define COSMIC_F14_ATTACK_EVENT_HOOK_VERSION 1' acore/src/server/game/Scripting/ScriptDefines/UnitScript.h
          # Existing (unpatched) Core removal hook used for retirement: exact
          # signature, dispatched FIRST in Creature::RemoveFromWorld.
          grep -Fq 'virtual void OnCreatureRemoveWorld(Creature* /*creature*/) { }' acore/src/server/game/Scripting/ScriptDefines/AllCreatureScript.h
          python3 - <<'PY'
          from pathlib import Path
          src=Path('acore/src/server/game/Entities/Creature/Creature.cpp').read_text()
          body=src.split('void Creature::RemoveFromWorld()',1)[1]
          body=body[:body.index('\n}\n')]
          hook=body.index('sScriptMgr->OnCreatureRemoveWorld(this);')
          assert hook < body.index('Unit::RemoveFromWorld();'), 'removal hook must precede Unit::RemoveFromWorld'
          assert hook < body.index('GetMap()->GetObjectsStore().Remove<Creature>(GetGUID());')
          print('PASS: OnCreatureRemoveWorld fires before the creature leaves its map')
          PY
          ! grep -Rq 'define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          echo 'PASS: original default-ALLOW prototypes applied; refresh bridge still absent'

      - name: Apply #67 real server-side after-pass notifier + validate pinned Core routes (NO CLIENT ACK)
        shell: bash
        run: |
          set -euo pipefail
          patchfile=../f14-observer/tests/core_patches/f14_visibility_pass_observed_prototype.patch
          # The older three default-ALLOW F14 prototype patches and paid-row
          # protection have already applied and passed their exact-path gate.
          git -C acore apply --check "$patchfile"
          git -C acore apply "$patchfile"
          git -C acore diff --check
          python3 -B -m unittest discover -s f14-observer/tests \
            -p 'test_ip_f14_core_visibility_pass_prototype_source.py' -v
          COSMIC_F14_PINNED_CORE_ROOT="$PWD/acore" python3 -B -m unittest discover -s f14-observer/tests \
            -p 'test_ip_f14_core_refresh_delivery_path.py' -v
          grep -Fq 'OnF14VisibilityReevaluationProcessed(this, true)' acore/src/server/game/Entities/Player/PlayerUpdates.cpp
          grep -Fq 'OnF14VisibilityReevaluationProcessed(this, false)' acore/src/server/game/Entities/Object/Object.cpp
          grep -Fq 'WORLDOBJECTHOOK_ON_F14_VISIBILITY_REEVALUATION_PROCESSED' acore/src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
          ! grep -Rq 'define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          git -C acore diff --name-only | sort > /tmp/joint-core-actual
          { cat /tmp/allowed-core; printf '%s\n' 'src/server/game/Entities/Player/PlayerUpdates.cpp'; } | sort > /tmp/joint-core-allowed
          diff -u /tmp/joint-core-allowed /tmp/joint-core-actual
          test -z "$(git -C acore/modules/mod-playerbots status --porcelain)"
          echo 'PASS: exact #69 lifecycle and #67 after-pass coexist on disposable pinned Core; no client ACK/feature activation'

      - name: Apply per-viewer Core server-link transition callback AFTER #67; NO CLIENT ACK
        shell: bash
        run: |
          set -euo pipefail
          file="$PWD/f14-core-refresh/tests/core_patches/f14_per_viewer_server_link_observed_prototype.patch"
          git -C acore apply --check "$file"
          git -C acore apply "$file"
          git -C acore diff --check
          git -C acore diff --name-only | sort > /tmp/per-viewer-core-actual
          diff -u /tmp/joint-core-allowed /tmp/per-viewer-core-actual
          grep -Fq 'void ScriptMgr::OnF14ViewerTargetLinkChanged(' acore/src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp
          grep -Fq 'WORLDOBJECTHOOK_ON_F14_VIEWER_TARGET_LINK_CHANGED' acore/src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
          grep -Fq 'OnF14ViewerTargetLinkChanged(this, target, HaveAtClient(target), true)' acore/src/server/game/Entities/Player/PlayerUpdates.cpp
          grep -Fq 'OnF14ViewerTargetLinkChanged(this, target, HaveAtClient(target), false)' acore/src/server/game/Entities/Player/PlayerUpdates.cpp
          ! grep -Rq '#define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          python3 -B -m unittest discover -s f14-core-refresh/tests \
            -p 'test_ip_f14_per_viewer_link_source.py' -v
          echo 'PASS: exact per-viewer link callbacks added in disposable Core; NO packet/client ACK, deny or refresh permission'

      - name: Apply default-false Core target refresh request after lifecycle+viewer observer hooks
        shell: bash
        run: |
          set -euo pipefail
          patch="$PWD/f14-core-refresh/tests/core_patches/f14_event_visibility_refresh_request_prototype.patch"
          # Five deliberately encoded empty diff-context lines avoid trailing
          # whitespace in the immutable patch ASSET. Decode only for git apply.
          test "$(grep -c '^@F14_BLANK_CONTEXT@$' "$patch")" = 5
          normalized="$RUNNER_TEMP/f14-event-refresh-normalized.patch"
          sed 's/^@F14_BLANK_CONTEXT@$/ /' "$patch" > "$normalized"
          ! grep -q '^@F14_BLANK_CONTEXT@' "$normalized"
          # Strict exact-source patch validation. No fuzz or live-server edits.
          git -C acore apply --check --verbose "$normalized"
          git -C acore apply "$normalized"
          git -C acore diff --check
          git -C acore diff --name-only | sort > /tmp/event-refresh-core-actual
          diff -u /tmp/joint-core-allowed /tmp/event-refresh-core-actual
          grep -Fq 'CALL_ENABLED_BOOLEAN_HOOKS_WITH_DEFAULT_FALSE(UnitScript, UNITHOOK_ON_F14_CREATURE_VISIBILITY_REFRESH_REQUEST,' acore/src/server/game/Scripting/ScriptDefines/UnitScript.cpp
          grep -Fq 'OnF14ShouldRefreshCreatureVisibility(Creature const* /*creature*/) { return false; }' acore/src/server/game/Scripting/ScriptDefines/UnitScript.h
          grep -Fq 'F14MaybeRefreshCreatureVisibility(this, f14PreviousGuid);' acore/src/server/game/Entities/Unit/Unit.cpp
          grep -Fq 'F14MaybeRefreshCreatureVisibility(this, f14VictimGuid);' acore/src/server/game/Entities/Unit/Unit.cpp
          grep -Fq 'OnF14CreatureCorpseReady(this);' acore/src/server/game/Entities/Creature/Creature.cpp
          ! grep -Rq '#define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          python3 -B -m unittest discover -s f14-core-refresh/tests \
            -p 'test_ip_f14_event_refresh_request_source.py' -v
          echo 'PASS: default-false post-event Core refresh route composes without enabling concealment or client ACK'

      - name: Apply source-attributed F14 per-viewer Core seam (NO ACTIVE HIDE)
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          python3 -B "$ip/tests/core_patches/apply_f14_viewer_suppression_attribution.py" acore
          # Original #86 test_ip_runtime_remains_unwired checked that no
          # IP observation callback existed. #106 deliberately adds ONLY an
          # opt-in diagnostic callback while keeping positive hide absent.
          # Retain all FOUR compatible source/Core tests explicitly, not a
          # blanket skip or a silently weakened default-FALSE assertion.
          COSMIC_F14_PINNED_CORE_ROOT="$PWD/acore" PYTHONPATH="$ip/tests" \
            python3 -B -m unittest -v \
              test_ip_f14_viewer_suppression_attribution.PrototypeStructure.test_patcher_is_syntax_valid_and_exactly_four_files \
              test_ip_f14_viewer_suppression_attribution.CoreAttribution.test_positive_query_defaults_false_and_emits_source_tag \
              test_ip_f14_viewer_suppression_attribution.CoreAttribution.test_direct_and_batched_consult_core_once_and_only_tag_f14 \
              test_ip_f14_viewer_suppression_attribution.CoreAttribution.test_no_global_see_or_detect_hook_or_full_ready_macro
          # The #107 exact-SIX-path and pre-#108 no-Map-header expectations
          # are obsolete on stacked #109. Retain all four original #86
          # default-FALSE attribution tests above, plus the FOUR original #107
          # Core fixture/patcher guarantees; never weaken the actual Core path.
          PYTHONPATH="$ip/tests" python3 -B -m unittest -v \
            test_ip_f14_preunlink_source_attribution.CoreFixture.test_failure_is_atomic_without_partial_core_changes \
            test_ip_f14_preunlink_source_attribution.CoreFixture.test_prelink_both_paths_and_old_posthook_unchanged \
            test_ip_f14_preunlink_source_attribution.CoreFixture.test_reapply_refused_without_second_mutation \
            test_ip_f14_preunlink_source_attribution.ScopeAndImmutable.test_patcher_is_restrictive_and_both_paths
          git -C acore diff --check
          grep -Fq 'CALL_ENABLED_BOOLEAN_HOOKS_WITH_DEFAULT_FALSE(WorldObjectScript' \
