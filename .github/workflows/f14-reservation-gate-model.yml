name: F14 reservation gate model
on:
  push:
    branches:
      - feature/cs01-ip146-f14-reservation-gate-model-20261112
  pull_request:
    paths:
      - src/IndividualProgressionF14ReservationGate.h
      - tests/f14_reservation_gate_test.cpp
      - .github/workflows/f14-reservation-gate-model.yml
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute standalone accounting model
        run: |
          set -euo pipefail
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -pthread "${extra[@]}" -Isrc tests/f14_reservation_gate_test.cpp -o /tmp/f14-gate
            /tmp/f14-gate
          done
