# Separate child-PR CI tests latest Grim Core 0d754 (84 commits beyond historical 8daffd).
# IP source is exact current integration candidate; no gameplay rules are changed.
# Disposable GitHub runner ONLY; no worldserver launch, database, host or deployment.
name: F14 Core visibility-pass observer native prototype (OFF)
on:
  pull_request:
    branches:
      - work/cs01-grim-f14-player-observer-pilot-20261104
    paths:
      - "src/**"
      - "conf/**"
      - "data/sql/**"
      - "optional/sql/**"
      - "docs/CUSTOM_MODIFICATIONS_REGISTER.md"
      - ".github/workflows/ip-f14-core-reevaluation-pass-native-20261104.yml"
      - "tests/core_patches/f14_visibility_pass_observed_prototype.patch"
      - "tests/test_ip_f14_core_visibility_pass_prototype_source.py"

permissions:
  contents: read

jobs:
  native-worldserver-link:
    name: newest Grim Core + optional reevaluation notifier (F14 OFF, NO LAUNCH)
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout Grim Core newer 0d754
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 0d754d1921261dfd939f91060ebc022eae280f71
          path: acore
          persist-credentials: false
      - name: Checkout historical pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact current Grim + Cosmic candidate PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acore/modules/mod-individual-progression
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout untouched Naxx first test candidate #292
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 51d0611476358286505aed3ca806ea250f644f66
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Checkout untouched Character Services first test #16
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-character-services
          ref: b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          path: acore/modules/mod-character-services
          persist-credentials: false

      - name: Checkout ORIGINAL tested F14 #56 prototype patches as read-only source
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          path: f14-original
          persist-credentials: false

      - name: Verify branch, exact pins and Cosmic+Grim custom preservation
        shell: bash
        run: |
          set -euo pipefail
          core=acore
          ip=acore/modules/mod-individual-progression
          cs=acore/modules/mod-character-services
          test "$(git -C "$core" rev-parse HEAD)" = 0d754d1921261dfd939f91060ebc022eae280f71
          test "$(git -C "$core/modules/mod-playerbots" rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C "$ip" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git -C "$ip" merge-base --is-ancestor 26d5b7a1de30ad92a595aaf251fc14754cf54f32 HEAD
          test "$(git -C "$core/modules/mod-naxxramas-core" rev-parse HEAD)" = 51d0611476358286505aed3ca806ea250f644f66
          test "$(git -C "$cs" rev-parse HEAD)" = b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          grep -Fqx 'IndividualProgression.AutoAttune = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotGroupFloor = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fqx 'IndividualProgression.F14.PreserveVerifiedRandomBotStageOnLogin = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fqx 'CharacterServices.ExpansionUnlock.Enable = 0' "$cs/conf/character_services.conf.dist"
          grep -Fq 'bool AutoAttune = false;' "$ip/src/IndividualProgression.h"
          grep -Fq 'GrantAttunements(Player* player, ProgressionState state)' "$ip/src/IndividualProgression.cpp"
          grep -Fq 'sIndividualProgression->GrantAttunements(player, newState)' "$ip/src/IndividualProgression.cpp"
          grep -Fq 'if (!sIndividualProgression->isNormalAccount(player)) // bot or exluded account' "$ip/src/IndividualProgressionPlayer.cpp"
          ! grep -Fq 'ForceUpdateProgressionState(player, static_cast<ProgressionState>(18))' "$ip/src/IndividualProgressionPlayer.cpp"
          grep -Fq 'RememberF14VerifiedRandomBotGroupIdentity' "$ip/src/IndividualProgressionPlayer.cpp"
          grep -Fq 'NeedsPaidGrantAudit(' "$ip/src/cs_individualProgression.cpp"
          grep -Fq 'ShouldSkipF14VerifiedRandomBotGroupDowngrade(' "$ip/src/IndividualProgression.cpp"
          grep -Fq 'PurchaseExpansion(Player* player' "$ip/src/IndividualProgression.h"
          grep -Fq 'GetAccountEffectiveProgression(uint32 accountId)' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'AccountProgressionForTierService(' "$cs/src/CharacterServices.cpp"
          grep -Fq 'AddSC_boss_chromaggus_60_2_A();' "$ip/src/IndividualProgression_loader.cpp"
          test -s "$ip/src/vanillaScripts/boss_chromaggus.cpp"
          grep -Fq 'spell_bwl_chromaggus_time_lapse' "$ip/data/sql/world/base/dungeon_blackwing_lair.sql"
          test -s "$ip/docs/CUSTOM_MODIFICATIONS_REGISTER.md"
          test -s "$ip/docs/UPSTREAM_GRIM_20261104_INTEGRATION_MATRIX.md"
          echo 'PASS: proposed upstream/source integration retains Cosmic custom policy and defaults OFF'

      - name: Run focused OFF / GM / hunter / group portable source tests
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          # New additive contract specifically for the Grim+Cosmic source merge;
          # leave the older frozen original-PR provenance tests intact.
          # This child intentionally adds default-OFF F14 login source on top
          # of the earlier protected #59 baseline; preserve frozen tests there.
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_verified_rndbot_tbc_floor.py' -v
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_grim_player_who_observer_source.py' -v
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_gm_command_null_safety.py' -v
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_group_floor_source.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 "$ip/tests/f14_group_sync_floor.cpp" -o /tmp/ip-grim-f14-floor
          /tmp/ip-grim-f14-floor | tee /tmp/ip-grim-f14-floor.out
          grep -Fq 'F14 GROUP FLOOR MODEL 1805/1805 passed' /tmp/ip-grim-f14-floor.out

      - name: Apply exact two-file Core paid-row safety patch on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          core=acore
          ip=$core/modules/mod-individual-progression
          target=src/server/game/Entities/Player/PlayerSettings.cpp
          player=src/server/game/Entities/Player/Player.h
          patch=modules/mod-individual-progression/tests/core_patches/preserve_paid_receipt_row.patch
          test "$(git -C "$core" rev-parse "HEAD:$target")" = f1eb86367ce69111867ef7187125f5fe456c5367
          test "$(git -C "$core" rev-parse "HEAD:$player")" = 5a29ac7b40ade7a11f1fcf36623dc7530ea39595
          test -s "$core/$patch"
          git -C "$core" apply --check "$patch"
          git -C "$core" apply "$patch"
          git -C "$core" diff --check
          git -C "$core" diff --name-only | sort > /tmp/actual-core.txt
          printf '%s\n' "$player" "$target" | sort > /tmp/expected-core.txt
          diff -u /tmp/expected-core.txt /tmp/actual-core.txt
          grep -Fq 'SerializeSettingsData(parsed) == data' "$core/$target"
          grep -Fq 'if (!PlayerSettingsStore::IsCanonicalPaidReceiptRow(source, data))' "$core/$target"
          grep -Fq 'if (unsafePaidRow)' "$core/$target"
          grep -Fq 'm_preserveMalformedPaidSettingsRow' "$core/$target"
          grep -Fq 'bool m_preserveMalformedPaidSettingsRow = false;' "$core/$player"
          grep -Fq 'ReceiptPolicy::DecodeRaw' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'player->IsBeingTeleportedFar()' "$ip/src/IndividualProgressionExpansion.cpp"
          echo 'PASS: exact Core two-file raw-row guard applied only in disposable runner'

      - name: Apply original F14 observer/WHO/attack-corpse Core patches (CI ONLY)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C f14-original rev-parse HEAD)" = 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          test "$(git -C acore rev-parse HEAD)" = 0d754d1921261dfd939f91060ebc022eae280f71
          # #56 observer and WHO patches apply exactly on newest Core.
          for patch in \
            f14_observer_visibility_default_allow_prototype.patch \
            f14_who_cached_entry_prototype.patch \
            f14_attack_corpse_event_bridge_prototype.patch; do
            original="f14-original/tests/core_patches/$patch"
            test -s "$original"
            patchfile="../$original"
            if [[ "$patch" == f14_attack_corpse_event_bridge_prototype.patch ]]; then
              # Newer Grim Core adds an extra defaulted CombatStop argument.
              # Adapt ONLY the old patch's trailing context, not its semantics.
              grep -Fq 'void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)' acore/src/server/game/Entities/Unit/Unit.cpp
              patchfile="$RUNNER_TEMP/f14-newer-grim-attack-context.patch"
              python3 - "$original" "$patchfile" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text()
          old=" void Unit::CombatStop(bool includingCast, bool mutualPvP)\n"
          new=" void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)\n"
          assert src.count(old)==1 and new not in src
          Path(sys.argv[2]).write_text(src.replace(old,new))
          PY
            fi
            git -C acore apply --check "$patchfile"
            git -C acore apply "$patchfile"
            echo "PASS: exact original F14 prototype patch $patch (context-adapted Unit only)"
          done
          git -C acore diff --check
          git -C acore diff --name-only | sort > /tmp/actual-combined-core-files
          printf '%s\n' \
            'src/server/game/Scripting/ScriptMgr.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.h' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.cpp' \
            'src/server/game/Entities/Object/Object.cpp' \
            'src/server/game/Entities/Player/Player.cpp' \
            'src/server/game/Entities/Player/Player.h' \
            'src/server/game/Entities/Player/PlayerSettings.cpp' \
            'src/server/game/Entities/Unit/Unit.cpp' \
            'src/server/game/Entities/Creature/Creature.cpp' \
            'src/server/game/Handlers/MiscHandler.cpp' | sort > /tmp/allowed-combined-core-files
          diff -u /tmp/allowed-combined-core-files /tmp/actual-combined-core-files
          # No completeness macro or configured F14 feature may be activated
          # simply because default-ALLOW Core prototype hooks compile.
          ! grep -Rq 'define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          grep -Fqx 'IndividualProgression.F14.ForceVerifiedRandomBotTbcFloorOnLogin = 0' acore/modules/mod-individual-progression/conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' acore/modules/mod-individual-progression/conf/individualProgression.conf.dist
          grep -Fq 'F14 player observer pilot requires Core observer, cached WHO and immediate refresh hooks; forcing OFF' acore/modules/mod-individual-progression/src/IndividualProgression.cpp
          grep -Fq 'new IndividualProgressionF14ObserverScript();' acore/modules/mod-individual-progression/src/IndividualProgressionPlayer.cpp
          echo 'PASS: source-only F14 prototype hooks and paid raw-row patch kept bounded; no F14 activation'

      - name: Apply real server-side visibility-pass notification prototype (no client ACK)
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          patch=modules/mod-individual-progression/tests/core_patches/f14_visibility_pass_observed_prototype.patch
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_core_visibility_pass_prototype_source.py' -v
          test -s "acore/$patch"
          git -C acore apply --check "$patch"
          git -C acore apply "$patch"
          git -C acore diff --check
          grep -Fq 'OnF14VisibilityReevaluationProcessed(this, true)' acore/src/server/game/Entities/Player/PlayerUpdates.cpp
          grep -Fq 'OnF14VisibilityReevaluationProcessed(this, false)' acore/src/server/game/Entities/Object/Object.cpp
          grep -Fq 'WORLDOBJECTHOOK_ON_F14_VISIBILITY_REEVALUATION_PROCESSED' acore/src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
          ! grep -Rq 'define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          git -C acore diff --name-only | sort > /tmp/actual-core-pass-files
          printf '%s\\n' \\
            src/server/game/Scripting/ScriptMgr.h \\
            src/server/game/Scripting/ScriptDefines/WorldObjectScript.h \\
            src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp \\
            src/server/game/Scripting/ScriptDefines/UnitScript.h \\
            src/server/game/Scripting/ScriptDefines/UnitScript.cpp \\
            src/server/game/Entities/Object/Object.cpp \\
            src/server/game/Entities/Player/Player.cpp \\
            src/server/game/Entities/Player/Player.h \\
            src/server/game/Entities/Player/PlayerSettings.cpp \\
            src/server/game/Entities/Player/PlayerUpdates.cpp \\
            src/server/game/Entities/Unit/Unit.cpp \\
            src/server/game/Entities/Creature/Creature.cpp \\
            src/server/game/Handlers/MiscHandler.cpp | sort > /tmp/expected-core-pass-files
          diff -u /tmp/expected-core-pass-files /tmp/actual-core-pass-files
          echo 'PASS: optional callback observes server-side reevaluation only; no client redraw ACK or F14 ON'

      - name: Assert newest Core matches UNMODIFIED pinned Playerbots API
        shell: bash
        run: |
          set -euo pipefail
          core=acore/src/server/database/Database/ModuleDatabasePool.h
          common=acore/src/common/Common.h
          pb=acore/modules/mod-playerbots
          # Historical Core 8daffd needs two narrow compatibility patches,
          # but Grim Core 0d754 already exposes BOTH native Playerbots APIs.
          # Preserve the exact pinned Playerbots source without ANY edits.
          grep -Fq 'virtual MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,' "$core"
          grep -Fq 'MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,' "$pb/src/Db/PlayerbotsDatabase.h"
          ! grep -Fq 'virtual MySQLConnection* CreateConnection(ProducerConsumerQueue<SQLOperation*>* queue,' "$core"
          grep -Fq 'inline bool IsLocaleRegistered(LocaleConstant locale)' "$common"
          grep -Fq 'if (!IsLocaleRegistered(locale))' "$pb/src/Util/LocaleColumns.h"
          test -z "$(git -C "$pb" status --porcelain)"
          echo 'PASS: latest Grim Core and exact clean Playerbots checkout have compatible database and locale APIs'
      - name: Install compile dependencies on disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Generate latest-Core static module compile database (NO SERVER START)
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-DCOSMIC_IP_F14_REQUIRE_PLAYERBOTS" \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Assert all three actual module C++ compilation units are in graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cc=json.loads(Path('acore-build/compile_commands.json').read_text())
          for module,file in [
            ('mod-individual-progression','IndividualProgressionExpansion.cpp'),
            ('mod-character-services','CharacterServices.cpp'),
            ('mod-naxxramas-core','Systems/MasterLootQuestGive.cpp')
          ]:
            hits=[entry for entry in cc
                  if entry.get('file','').replace('\\','/').endswith('/'+module+'/src/'+file)]
            assert len(hits)==1,(module,file,len(hits))
            print('PASS: real compilation unit present',module,file)
          PY
      - name: Compile AND link actual combined Worldserver (do not execute)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify finished binary without launching it
        run: |
          test -s acore-build/src/server/apps/worldserver
          test -x acore-build/src/server/apps/worldserver
          echo 'PASS: latest Grim Core + unchanged pinned PB + F14 WHO/player pilot and server reevaluation notifier forced OFF + original default-allow Core prototypes + Naxx292 + Services16 linked'
          echo 'No owner host, accounts, DB, NPC, gold, config, enablement or live archive touched'
      - name: Safety and confidence boundary
        if: always()
        run: |
          echo 'This is development-only latest Grim Core 0d754 and pinned historical PB compile/link.'
          echo 'Even native PASS does not certify future Core commits, SQL migrations, current installed Core or in-game behavior.'
          echo 'Do not merge/deploy to owner host without approval; AutoAttune and paid/F14 features OFF.'
