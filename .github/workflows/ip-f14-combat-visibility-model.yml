name: F14 combat creature-visibility policy model (UNWIRED, OFF)

on:
  push:
    paths:
      - 'src/IndividualProgressionF14CombatVisibilityPolicy.h'
      - 'tests/ip_f14_combat_visibility_policy.cpp'
      - 'tests/ip_f14_active_attack_transition.cpp'
      - '.github/workflows/ip-f14-combat-visibility-model.yml'
  pull_request:
    paths:
      - 'src/IndividualProgressionF14CombatVisibilityPolicy.h'
      - 'tests/ip_f14_combat_visibility_policy.cpp'
      - 'tests/ip_f14_active_attack_transition.cpp'
      - '.github/workflows/ip-f14-combat-visibility-model.yml'

jobs:
  pure-model:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run side-effect-free policy decisions
        run: |
          "${{ matrix.compiler }}" -std="${{ matrix.standard }}" -Wall -Wextra -Werror -pedantic -I. tests/ip_f14_combat_visibility_policy.cpp -o "$RUNNER_TEMP/f14-policy"
          "$RUNNER_TEMP/f14-policy"
          "${{ matrix.compiler }}" -std="${{ matrix.standard }}" -DNDEBUG -Wall -Wextra -Werror -pedantic -I. tests/ip_f14_combat_visibility_policy.cpp -o "$RUNNER_TEMP/f14-policy-ndebug"
          "$RUNNER_TEMP/f14-policy-ndebug"
          "${{ matrix.compiler }}" -std="${{ matrix.standard }}" -Wall -Wextra -Werror -pedantic -I. tests/ip_f14_active_attack_transition.cpp -o "$RUNNER_TEMP/f14-active-attack"
          "$RUNNER_TEMP/f14-active-attack"
          "${{ matrix.compiler }}" -std="${{ matrix.standard }}" -DNDEBUG -Wall -Wextra -Werror -pedantic -I. tests/ip_f14_active_attack_transition.cpp -o "$RUNNER_TEMP/f14-active-attack-ndebug"
          "$RUNNER_TEMP/f14-active-attack-ndebug"
