name: IP F14 verified Blood Elf Draenei RandomBot TBC login floor (DRAFT OFF)
on:
  pull_request:
    branches:
      - fix/cs01-ip-10259-saved-complete-login-sweep-20261102
    paths:
      - .github/workflows/ip-f14-rndbot-stage8-floor-20261102.yml
      - src/IndividualProgressionF14LoginPolicy.h
      - src/IndividualProgressionPlayer.cpp
      - src/IndividualProgression.cpp
      - src/IndividualProgression.h
      - conf/individualProgression.conf.dist
      - tests/test_ip_f14_tbc_floor_source.py
      - tests/test_ip_combined_c3_f14_partial_login.py
      - tests/f14_tbc_floor_policy.cpp
      - docs/F14_VERIFIED_RNDBOT_TBC_FLOOR_LOGIN_2026-11-02.md
      - docs/CUSTOM_MODIFICATIONS_REGISTER.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-off-stage8-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin parent and clean diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a6ac77d9fae9690be91f6ddb97422476164c0ca2 HEAD
          git diff --check a6ac77d9fae9690be91f6ddb97422476164c0ca2 HEAD
          test "$(git rev-parse HEAD:src/IndividualProgressionSpells.cpp)" = 6ee93e1174b5aef6c5d61c9ea31526506c9d08da
          test -z "$(git diff --name-only a6ac77d9fae9690be91f6ddb97422476164c0ca2 HEAD -- data sql optional src/cs_individualProgression.cpp src/IndividualProgressionGroupPolicy.h)"
      - name: Source and ancestor regression
        run: |
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_tbc_floor_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_ip_combined_c3_f14_partial_login.py' -v
      - name: Compile pure TBC floor policy C++17 C++20
        shell: bash
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            g++ -std="$std" -O2 -Wall -Wextra -Werror -pedantic tests/f14_tbc_floor_policy.cpp -o /tmp/f14-floor
            /tmp/f14-floor
          done
      - name: Documentation only - never deploy
        run: echo 'DRAFT S2/S3 source only. No actual Bot generation, full build, DB or game test.'
