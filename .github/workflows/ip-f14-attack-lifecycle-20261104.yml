# F14 attack/corpse lifecycle registry (IP-side event consumer), DEFAULT OFF.
# Child of #64 (c2cc14bc). Bookkeeping only: no concealment, no visibility
# refresh, no stage writes, no Playerbots calls on map threads.
# Disposable GitHub runner ONLY; no worldserver launch, database, host or deployment.
name: F14 attack/corpse lifecycle registry (OFF, NO HOST)
on:
  pull_request:
    branches:
      - work/cs01-grim-f14-player-observer-pilot-20261104
    paths:
      - "src/**"
      - "conf/**"
      - "tests/f14_lifecycle_registry.cpp"
      - "tests/test_ip_f14_lifecycle_source.py"
      - "docs/CUSTOM_MODIFICATIONS_REGISTER.md"
      - ".github/workflows/ip-f14-attack-lifecycle-20261104.yml"

permissions:
  contents: read

jobs:
  registry-model-and-source:
    name: "Lifecycle registry model + source contracts (${{ matrix.cxx }} ${{ matrix.std }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++17, c++20]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: "Verify #64 ancestry and EXACT ten-path child scope"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD
          git merge-base --is-ancestor 95b05996ec44c1f4745f4eba544cf95903e4a75d HEAD
          git diff --name-only c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ip-f14-attack-lifecycle-20261104.yml' \
            'conf/individualProgression.conf.dist' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'src/IndividualProgression.cpp' \
            'src/IndividualProgression.h' \
            'src/IndividualProgressionF14LifecycleRegistry.h' \
            'src/IndividualProgressionF14LifecycleScript.cpp' \
            'src/IndividualProgressionPlayer.cpp' \
            'tests/f14_lifecycle_registry.cpp' \
            'tests/test_ip_f14_lifecycle_source.py' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/actual
          git diff --check c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD
          # Upstream Grim loader and every pure F14 policy stay byte-identical.
          for f in src/IndividualProgression_loader.cpp \
                   src/IndividualProgressionF14MultiAttackerPolicy.h src/IndividualProgressionF14ActorCreatureIndex.h \
                   src/IndividualProgressionF14CombatVisibilityPolicy.h src/IndividualProgressionF14RefreshPolicy.h; do
            git diff --quiet c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD -- "$f"
          done
          # IndividualProgressionPlayer.cpp: ONLY the login identity OR gate gains
          # the registry flag (one line changed, one line added). Nothing else.
          git diff -U0 c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD -- src/IndividualProgressionPlayer.cpp \
            | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' > /tmp/player-diff
          printf '%s\n' \
            '-             sIndividualProgression->f14ExperimentalRndbotPlayerVisibility) &&' \
            '+             sIndividualProgression->f14ExperimentalRndbotPlayerVisibility ||' \
            '+             sIndividualProgression->f14ExperimentalAttackLifecycleRegistry) &&' > /tmp/player-expected
          diff -u /tmp/player-expected /tmp/player-diff
          grep -Fqx 'IndividualProgression.F14.ExperimentalAttackLifecycleRegistry = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotGroupFloor = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' conf/individualProgression.conf.dist
          echo 'PASS: exact scope, OFF defaults, upstream loader and pure policies untouched'
      - name: Source contracts (new lifecycle + parent #64 observer contracts)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_lifecycle_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_grim_player_who_observer_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_verified_rndbot_tbc_floor.py' -v
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_group_floor_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_ip_gm_command_null_safety.py' -v
      - name: Lifecycle registry native tests (assert-free, with and without NDEBUG)
        shell: bash
        run: |
          set -euo pipefail
          for nd in "" "-DNDEBUG"; do
            "${{ matrix.cxx }}" "-std=${{ matrix.std }}" -O2 $nd \
              -Wall -Wextra -Werror -pedantic -Isrc \
              tests/f14_lifecycle_registry.cpp -o /tmp/f14-lifecycle
            /tmp/f14-lifecycle | tee /tmp/f14-lifecycle.out
            grep -Eq '^F14 LIFECYCLE REGISTRY ([0-9]+)/\1 passed$' /tmp/f14-lifecycle.out
          done
      - name: Original four F14 pure models still pass unchanged
        shell: bash
        run: |
          set -euo pipefail
          for model in f14_multi_attacker_policy f14_actor_creature_index ip_f14_combat_visibility_policy f14_visibility_refresh_policy; do
            "${{ matrix.cxx }}" "-std=${{ matrix.std }}" -O2 -DNDEBUG \
              -Wall -Wextra -Werror -pedantic -I. -Isrc \
              "tests/$model.cpp" -o "/tmp/f14-$model"
            "/tmp/f14-$model"
          done
      - name: Explicit non-gameplay boundary
        if: always()
        run: |
          echo 'Registry semantics only. No map/creature visibility, refresh, packet, loot, quest or stage behaviour is exercised.'

  native-worldserver-link:
    name: "Newest Grim Core + original F14 prototypes + lifecycle consumer (NO LAUNCH)"
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout Grim Core newer 0d754
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 0d754d1921261dfd939f91060ebc022eae280f71
          path: acore
          persist-credentials: false
      - name: Checkout historical pinned Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout exact PR head IP source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acore/modules/mod-individual-progression
          persist-credentials: false
          fetch-depth: 0
      - name: "Checkout untouched Naxx first test candidate #292"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 51d0611476358286505aed3ca806ea250f644f66
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: "Checkout untouched Character Services first test #16"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-character-services
          ref: b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          path: acore/modules/mod-character-services
          persist-credentials: false
      - name: "Checkout ORIGINAL tested F14 #56 prototype patches as read-only source"
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          path: f14-original
          persist-credentials: false

      - name: Verify exact pins and OFF defaults
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          test "$(git -C acore rev-parse HEAD)" = 0d754d1921261dfd939f91060ebc022eae280f71
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C "$ip" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git -C "$ip" merge-base --is-ancestor c2cc14bc9c18a3e60c984c491370e7da787a388a HEAD
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 51d0611476358286505aed3ca806ea250f644f66
          test "$(git -C acore/modules/mod-character-services rev-parse HEAD)" = b5d372eda5cd08b6a650c78a5faeb01ee1c3702d
          test "$(git -C f14-original rev-parse HEAD)" = 6cf528c0f1728ed3ec8fdd11e020f07ec23f3af5
          for key in AutoAttune PaidExpansion.Enable F14.ProtectVerifiedRandomBotGroupFloor \
                     F14.PreserveVerifiedRandomBotStageOnLogin F14.ForceVerifiedRandomBotTbcFloorOnLogin \
                     F14.ExperimentalRndbotPlayerVisibility F14.ExperimentalAttackLifecycleRegistry; do
            grep -Fqx "IndividualProgression.$key = 0" "$ip/conf/individualProgression.conf.dist"
          done
          grep -Fqx 'CharacterServices.ExpansionUnlock.Enable = 0' acore/modules/mod-character-services/conf/character_services.conf.dist
          echo 'PASS: exact pins; every paid/F14 option OFF'

      - name: Apply exact two-file Core paid-row safety patch (disposable runner)
        shell: bash
        run: |
          set -euo pipefail
          patch=modules/mod-individual-progression/tests/core_patches/preserve_paid_receipt_row.patch
          test "$(git -C acore rev-parse HEAD:src/server/game/Entities/Player/PlayerSettings.cpp)" = f1eb86367ce69111867ef7187125f5fe456c5367
          test "$(git -C acore rev-parse HEAD:src/server/game/Entities/Player/Player.h)" = 5a29ac7b40ade7a11f1fcf36623dc7530ea39595
          git -C acore apply --check "$patch"
          git -C acore apply "$patch"

      - name: Apply original F14 observer/WHO/attack-corpse Core prototypes (CI ONLY)
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            f14_observer_visibility_default_allow_prototype.patch \
            f14_who_cached_entry_prototype.patch \
            f14_attack_corpse_event_bridge_prototype.patch; do
            original="f14-original/tests/core_patches/$patch"
            test -s "$original"
            patchfile="../$original"
            if [[ "$patch" == f14_attack_corpse_event_bridge_prototype.patch ]]; then
              # Same trailing-context-only adaptation as the parent #64 workflow.
              grep -Fq 'void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)' acore/src/server/game/Entities/Unit/Unit.cpp
              patchfile="$RUNNER_TEMP/f14-newer-grim-attack-context.patch"
              python3 - "$original" "$patchfile" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text()
          old=" void Unit::CombatStop(bool includingCast, bool mutualPvP)\n"
          new=" void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)\n"
          assert src.count(old)==1 and new not in src
          Path(sys.argv[2]).write_text(src.replace(old,new))
          PY
            fi
            git -C acore apply --check "$patchfile"
            git -C acore apply "$patchfile"
          done
          git -C acore diff --check
          git -C acore diff --name-only | sort > /tmp/actual-core
          printf '%s\n' \
            'src/server/game/Scripting/ScriptMgr.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.h' \
            'src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.h' \
            'src/server/game/Scripting/ScriptDefines/UnitScript.cpp' \
            'src/server/game/Entities/Object/Object.cpp' \
            'src/server/game/Entities/Player/Player.cpp' \
            'src/server/game/Entities/Player/Player.h' \
            'src/server/game/Entities/Player/PlayerSettings.cpp' \
            'src/server/game/Entities/Unit/Unit.cpp' \
            'src/server/game/Entities/Creature/Creature.cpp' \
            'src/server/game/Handlers/MiscHandler.cpp' | sort > /tmp/allowed-core
          diff -u /tmp/allowed-core /tmp/actual-core
          grep -Fq '#define COSMIC_F14_ATTACK_EVENT_HOOK_VERSION 1' acore/src/server/game/Scripting/ScriptDefines/UnitScript.h
          # Existing (unpatched) Core removal hook used for retirement: exact
          # signature, dispatched FIRST in Creature::RemoveFromWorld.
          grep -Fq 'virtual void OnCreatureRemoveWorld(Creature* /*creature*/) { }' acore/src/server/game/Scripting/ScriptDefines/AllCreatureScript.h
          python3 - <<'PY'
          from pathlib import Path
          src=Path('acore/src/server/game/Entities/Creature/Creature.cpp').read_text()
          body=src.split('void Creature::RemoveFromWorld()',1)[1]
          body=body[:body.index('\n}\n')]
          hook=body.index('sScriptMgr->OnCreatureRemoveWorld(this);')
          assert hook < body.index('Unit::RemoveFromWorld();'), 'removal hook must precede Unit::RemoveFromWorld'
          assert hook < body.index('GetMap()->GetObjectsStore().Remove<Creature>(GetGUID());')
          print('PASS: OnCreatureRemoveWorld fires before the creature leaves its map')
          PY
          ! grep -Rq 'define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' acore/src/server/game
          echo 'PASS: original default-ALLOW prototypes applied; refresh bridge still absent'

      - name: Assert newest Core matches UNMODIFIED pinned Playerbots API
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'virtual MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,' acore/src/server/database/Database/ModuleDatabasePool.h
          grep -Fq 'inline bool IsLocaleRegistered(LocaleConstant locale)' acore/src/common/Common.h
          test -z "$(git -C acore/modules/mod-playerbots status --porcelain)"
      - name: Install compile dependencies on disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file binutils \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Generate static module compile database (NO SERVER START)
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-DCOSMIC_IP_F14_REQUIRE_PLAYERBOTS" \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Assert lifecycle consumer and sibling modules are real compilation units
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cc=json.loads(Path('acore-build/compile_commands.json').read_text())
          for module,file in [
            ('mod-individual-progression','IndividualProgressionF14LifecycleScript.cpp'),
            ('mod-individual-progression','IndividualProgression.cpp'),
            ('mod-character-services','CharacterServices.cpp'),
            ('mod-naxxramas-core','Systems/MasterLootQuestGive.cpp')
          ]:
            hits=[e for e in cc if e.get('file','').replace('\\','/').endswith('/'+module+'/src/'+file)]
            assert len(hits)==1,(module,file,len(hits))
            print('PASS: real compilation unit present',module,file)
          PY
      - name: Compile AND link actual combined Worldserver (do not execute)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify hook consumer was compiled in (not preprocessed away) and binary exists
        shell: bash
        run: |
          set -euo pipefail
          obj=$(find acore-build -name 'IndividualProgressionF14LifecycleScript.cpp.o' | head -n1)
          test -s "$obj"
          # Render once to a file: `nm | grep -q` can SIGPIPE under pipefail.
          nm -C "$obj" > /tmp/f14-lifecycle-symbols.txt
          grep -Fq 'IndividualProgressionF14LifecycleScript::OnF14AttackTargetTransition(Unit*, Unit*, Unit*)' /tmp/f14-lifecycle-symbols.txt
          grep -Fq 'IndividualProgressionF14LifecycleScript::OnF14CreatureCorpseReady(Creature*)' /tmp/f14-lifecycle-symbols.txt
          grep -Fq 'IndividualProgressionF14LifecycleScript::OnF14CreatureRespawned(Creature*)' /tmp/f14-lifecycle-symbols.txt
          grep -Fq 'IndividualProgressionF14LifecycleRemovalScript::OnCreatureRemoveWorld(Creature*)' /tmp/f14-lifecycle-symbols.txt
          test -x acore-build/src/server/apps/worldserver
          echo 'PASS: newest Grim Core + unchanged PB + Naxx292 + Services16 + F14 prototypes + OFF lifecycle consumer linked'
      - name: Safety and confidence boundary
        if: always()
        run: |
          echo 'Development-only compile/link. The worldserver was NOT started; no DB, host, account, config or deployment touched.'
          echo 'A native PASS does not prove in-game combat, corpse, logout or visibility behaviour. Feature stays OFF.'
