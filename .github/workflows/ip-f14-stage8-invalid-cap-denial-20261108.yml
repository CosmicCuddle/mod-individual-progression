name: IP F14 stage8 invalid-cap denial policy native (default OFF)

on:
  push:
    branches:
      - fix/cs01-ip136-f14-stage8-invalid-cap-denial-20261108
  pull_request:
    branches:
      - fix/cs01-ip135-opt-in-verified-login-publication-gate-20261108

permissions:
  contents: read

jobs:
  stage8-invalid-cap-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source and immutable IP136 parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Four paths only; preserve original custom code, paid and F14 OFF defaults
        shell: bash
        run: |
          set -euo pipefail
          base=29fa9a179039ebf292ee137005cbdd112407581a
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort >/tmp/actual
          printf '%s\n' \
            'src/IndividualProgressionF14LoginPolicy.h' \
            'tests/test_ip_f14_stage8_invalid_cap_native.py' \
            '.github/workflows/ip-f14-stage8-invalid-cap-denial-20261108.yml' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$base" HEAD -- src/IndividualProgressionPlayer.cpp src/IndividualProgression.cpp conf data sql)"
          grep -Fqx 'IndividualProgression.F14.ForceVerifiedRandomBotTbcFloorOnLogin = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' conf/individualProgression.conf.dist
          echo 'PASS: tiny pure cap arithmetic change, no stage writes or active visibility'
      - name: GCC and Clang C++17 C++20 old-RED new-GREEN actual policy execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_ip_f14_stage8_invalid_cap_native.py -v
      - name: Preserve inherited original F14 source and actual C++ policy
        shell: bash
        run: |
          set -euo pipefail
          for t in test_ip_f14_tbc_floor_source.py test_ip_f19_login_floor_source.py test_ip_f14_group_floor_source.py; do
            python3 -B -m unittest discover -s tests -p "$t" -v
          done
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              "$compiler" -std="$std" -Wall -Wextra -Werror -O2 \
                tests/f14_tbc_floor_policy.cpp -o /tmp/f14-tbc-floor-test
              /tmp/f14-tbc-floor-test
            done
          done
      - name: Scope/evidence boundary
        if: always()
        run: |
          echo 'This run does NOT compile or launch the full Worldserver.'
          echo 'World TBC availability, first-birth identity, existing bot safety and paid exception are NOT proved.'
          echo 'No positive F14 hide, character stage grant, owner machine, SQL/DB, client or configuration change.'
