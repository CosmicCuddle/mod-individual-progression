            '.github/workflows/ip-f14-rights-create-observer-native-20261105.yml' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check 4ec81739efef98adb6fcdc2fa15a731458bfba04
          test -z "$(git diff --name-only 4ec81739efef98adb6fcdc2fa15a731458bfba04 HEAD -- sql data optional)"
          test "$(git rev-parse HEAD:src/IndividualProgression.cpp)" = a8fcf1ba7f50233e460ba897c51447c9a05e0149
          test "$(git rev-parse HEAD:src/IndividualProgression.h)" = 73392659647c51dc18b7c7124bf2d32f4cfde92f
          test "$(git rev-parse HEAD:src/IndividualProgressionPlayer.cpp)" = cf5df36791d03ef0138306683892d0c312987330
          test "$(git rev-parse HEAD:src/cs_individualProgression.cpp)" = dce8e36d5133c0bac5e8b0f269675781dd2776ba
          test "$(git rev-parse HEAD:conf/individualProgression.conf.dist)" = 66d36a2701367a208cb28163288b77c2d7b267d6
          test "$(git rev-parse HEAD:src/IndividualProgressionF14StageFloorPolicy.h)" = bca72e9b0addca276ec77f9c8d4c5e530dabcb17
          test "$(git rev-parse HEAD:tests/f14_stage_floor_policy.cpp)" = b531e9a500addf1c89d8787f950561d2dd8c968d
          test "$(git rev-parse HEAD:tests/test_ip_f14_stage_floor_source.py)" = 225e9b5c83aa487910df62131589d76596622b92
          test "$(git rev-parse HEAD:tests/test_ip_f14_stage_floor_gm_successor.py)" = ee7349c3c6af37ee4030519b160ffa8ade5c9d89
          test "$(git rev-parse HEAD:tests/core_patches/apply_f14_viewer_suppression_attribution.py)" = 8c00f7b557d7c82e2472768f8c35300df6ff0122
