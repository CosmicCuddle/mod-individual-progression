            done
          done
          for name in test_ip_f14_stage_floor_source.py test_ip_f14_lifecycle_source.py \
                      test_ip_f14_rights_refresh_source.py test_ip_f14_refresh_poison_status_source.py; do
            python3 -B -m unittest discover -s tests -p "$name" -v
          done
          echo 'PASS: #94 untouched pure restoration protocol C++17/20 GCC/Clang + NDEBUG linked against #92 actual newer registry. NOT integrated into Worldserver; no client proof.'
