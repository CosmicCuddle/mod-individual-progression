          src=Path('acore/src/server/game/Entities/Creature/Creature.cpp').read_text()
          body=src.split('void Creature::RemoveFromWorld()',1)[1]
          body=body[:body.index('\n}\n')]
          hook=body.index('sScriptMgr->OnCreatureRemoveWorld(this);')
          assert hook < body.index('Unit::RemoveFromWorld();'), 'removal hook must precede Unit::RemoveFromWorld'
          assert hook < body.index('GetMap()->GetObjectsStore().Remove<Creature>(GetGUID());')
          print('PASS: OnCreatureRemoveWorld fires before the creature leaves its map')
