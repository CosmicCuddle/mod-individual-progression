# IP F14 logout identity -> owned-map refresh handoff, experimental, default OFF.
# Child of #82, includes Core #77 event hook and verified #78 minion evidence.
# Bounded key+incarnation queue, NO Unit* across threads and no hide or rights.
name: F14 actual IP rights plus Core CREATE/OUT attempts and #94 pure protocol (NO HOST)

on:
  push:
    branches:
      - research/cs01-f14-rights-with-create-attempt-native-20261105
  pull_request:
    branches:
      - research/cs01-ip-f14-rights-stagefloor-integration-20261105
    paths:
      - ".github/workflows/ip-f14-rights-create-observer-native-20261105.yml"

permissions:
