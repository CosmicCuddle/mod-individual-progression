            if [[ "$patch" == f14_attack_corpse_event_bridge_prototype.patch ]]; then
              # Same trailing-context-only adaptation as the parent #64 workflow.
              grep -Fq 'void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)' acore/src/server/game/Entities/Unit/Unit.cpp
              patchfile="$RUNNER_TEMP/f14-newer-grim-attack-context.patch"
              python3 - "$original" "$patchfile" <<'PY'
          import sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text()
          old=" void Unit::CombatStop(bool includingCast, bool mutualPvP)\n"
          new=" void Unit::CombatStop(bool includingCast, bool mutualPvP, bool keepPvPForOthers)\n"
          assert src.count(old)==1 and new not in src
          Path(sys.argv[2]).write_text(src.replace(old,new))
          PY
            fi
