          test -z "$(git diff --name-only 4ec81739efef98adb6fcdc2fa15a731458bfba04 HEAD -- src/IndividualProgressionF14LifecycleScript.cpp src/IndividualProgressionF14LifecycleRegistry.h src/IndividualProgressionF14LogoutRefreshQueue.h)"
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotStageFloor = 0' conf/individualProgression.conf.dist
