jobs:
  source-protocol-compat:
    name: #92 actual runtime frozen and #94 pure protocol against newest #92 registry (NO HOST)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen Claude #94 source/model as read-only reference (NO SOURCE OVERLAY)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 61302474b2c0e2acfcc6b5c32036dde1517e43c5
          path: f14-protocol-reference
          persist-credentials: false
      - name: Verify one-file CI scope and parent source, all flags OFF
        shell: bash
        run: |
          set -euo pipefail
          parent=621673d66a0cd02a9a4667b0a8f62b1cf6b8ffde
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/ip-f14-rights-create-observer-native-20261105.yml'
          git diff --check "$parent"
          test -z "$(git diff --name-only "$parent" HEAD -- src conf sql data optional tests docs)"
          test "$(git rev-parse HEAD:src/IndividualProgressionF14LifecycleRegistry.h)" = 2d6bf7fb473ae118be35a0c9f98276b8bed1e2e8
          test "$(git -C f14-protocol-reference rev-parse HEAD)" = 61302474b2c0e2acfcc6b5c32036dde1517e43c5
          test "$(git -C f14-protocol-reference rev-parse HEAD:src/IndividualProgressionF14PriorHiddenLedger.h)" = 2250bae56bb09a810d337927f738bd3cbcf5fddd
          test "$(git -C f14-protocol-reference rev-parse HEAD:src/IndividualProgressionF14ViewerRestoreProtocol.h)" = f520356a8152d98580751604f4649fe1b564f072
          test "$(git -C f14-protocol-reference rev-parse HEAD:tests/f14_viewer_restore_protocol.cpp)" = 9bce90ed2c3e0f05dc41583d8e96b4f53f661422
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotStageFloor = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' conf/individualProgression.conf.dist
          ! grep -Rqs 'OnF14ShouldAttributeCreatureCreateAttempt(' src
          ! grep -Rqs 'OnF14VisibilityBatchCreateAttempt(' src
          ! grep -Rqs '#define COSMIC_F14_VISIBILITY_REFRESH_HOOK_VERSION' src
          echo 'PASS: actual #92 runtime files byte-identical; #94 original source unchanged'
      - name: Compile original #94 protocol tests using #92 exact modified lifecycle registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f14-protocol-compat
          cp f14-protocol-reference/src/IndividualProgressionF14PriorHiddenLedger.h /tmp/f14-protocol-compat/
          cp f14-protocol-reference/src/IndividualProgressionF14ViewerRestoreProtocol.h /tmp/f14-protocol-compat/
          test ! -e /tmp/f14-protocol-compat/IndividualProgressionF14LifecycleRegistry.h
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              for ndebug in 0 1; do
                flags=()
                if [ "$ndebug" = 1 ]; then flags+=("-DNDEBUG"); fi
                "$compiler" -std="$std" -Wall -Wextra -Werror -pedantic -O2 "${flags[@]}" \
                  -I/tmp/f14-protocol-compat -Isrc \
                  f14-protocol-reference/tests/f14_viewer_restore_protocol.cpp \
                  -o /tmp/cosmic-f14-viewer-compat
                /tmp/cosmic-f14-viewer-compat
