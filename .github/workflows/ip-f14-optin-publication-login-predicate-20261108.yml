name: F14 IP136 opt-in verified login actor-source publisher (NO HIDE)

on:
  push:
    branches:
      - fix/cs01-ip135-opt-in-verified-login-publication-gate-20261108
  pull_request:
    branches:
      - fix/cs01-ip134-nested-lease-default-arg-native-20261108

permissions:
  contents: read

jobs:
  diagnostic-login-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact child and preserved IP135 parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Four-path exact scope and immutable defaults
        shell: bash
        run: |
          set -euo pipefail
          base=73e2748e0ab5bd3078cdb045a8f93f57605dd286
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort >/tmp/actual
          printf '%s\n' \
            'src/IndividualProgressionPlayer.cpp' \
            'tests/test_ip_f14_optin_publication_login_predicate.py' \
            '.github/workflows/ip-f14-optin-publication-login-predicate-20261108.yml' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$base" HEAD -- conf sql data)"
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' conf/individualProgression.conf.dist
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' conf/individualProgression.conf.dist
          ! grep -Fq 'COSMIC_IP_F14_VERIFIED_ACTOR_PUBLICATION_EXPERIMENT' src/IndividualProgressionPlayer.cpp
          echo 'PASS: source predicate only, ordinary lease OFF, no game/SQL/config changes'
      - name: Actual source old-RED new-GREEN executable, GCC Clang C++17/20
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_ip_f14_optin_publication_login_predicate.py' -v
      - name: Rerun inherited genuine RandomBot + stale reload + Core6 FALSE-only contracts
        shell: bash
        run: |
          set -euo pipefail
          for t in \
            test_ip_f14_actor_publication_reload_generation_source.py \
            test_ip_f14_nested_lease_header_compile.py \
            test_ip_f14_atomic_publication_reload_source.py \
            test_ip_f14_current_actor_publication_source.py \
            test_ip_f14_disabled_login_revoke_source.py \
            test_ip_f14_group_floor_source.py \
            test_ip_f14_core6_negative_actor_who_adapter_source.py; do
            python3 -B -m unittest discover -s tests -p "$t" -v
          done
      - name: Preserve original native C++ actor reload interleaving model
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              for mode in normal ndebug; do
                flags=()
                if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
                "$compiler" -std="$std" -pthread -Wall -Wextra -Werror -pedantic -O2 "${flags[@]}" \
                  tests/f14_actor_publication_reload_generation_model.cpp -o /tmp/f14-reload-generation-model
                /tmp/f14-reload-generation-model
              done
            done
          done
      - name: Evidence boundary
        if: always()
        run: |
          echo 'Only original source predicate and portable model compiled/executed.'
          echo 'Actor/WHO/creature hooks stay FALSE; no stage8, quest, paid or actual hide.'
          echo 'NOT Worldserver native link, installed modules, database, client or gameplay.'
