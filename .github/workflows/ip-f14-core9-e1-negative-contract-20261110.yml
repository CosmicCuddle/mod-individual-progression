name: IP Core9 E1 negative-only send-attempt contract (NO HOST, OFF)

on:
  push:
    branches:
      - test/cs01-ip143-core9-e1-negative-contract-20261110
  pull_request:
    branches:
      - fix/cs02-f14-e1-pass-liveness-20261110

permissions:
  contents: read

jobs:
  core9-e1-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++17, c++20]
    steps:
      - name: Checkout exact isolated development head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact four-path additive child, unmodified runtime and append-only register
        shell: bash
        run: |
          set -euo pipefail
          parent=e92f6e0e4ecc81d0656d5e66e468a9b13c467478
          git merge-base --is-ancestor "$parent" HEAD
          git diff --check "$parent" HEAD
          git diff --name-only "$parent" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ip-f14-core9-e1-negative-contract-20261110.yml' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'tests/f14_core9_e1_negative_contract.cpp' \
            'tests/test_ip_f14_core9_e1_negative_contract_source.py' \
            | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/actual
          test -z "$(git diff --name-only "$parent" HEAD -- src conf sql modules data)"
          test "$(git rev-parse "HEAD:src/IndividualProgressionF14SendAttemptCorrelation.h")" = \
               "$(git rev-parse "$parent:src/IndividualProgressionF14SendAttemptCorrelation.h")"
          git diff -U0 "$parent" HEAD -- docs/CUSTOM_MODIFICATIONS_REGISTER.md \
            | grep '^-' | grep -v '^--- ' > /tmp/removed || true
          test ! -s /tmp/removed

      - name: Source-only unwired and refusal contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests \
            -p test_ip_f14_core9_e1_negative_contract_source.py -v

      - name: Compile and execute all negative-only Core9-shaped E1 model cases
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal ndebug; do
            flags=()
            if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
            ${{ matrix.cxx }} -std=${{ matrix.std }} -Wall -Wextra -Werror \
              -pedantic -O2 "${flags[@]}" -Isrc \
              tests/f14_core9_e1_negative_contract.cpp \
              -o /tmp/f14-e1-core9-negative
            /tmp/f14-e1-core9-negative | tee /tmp/model.out
            grep -q 'ZERO SYNTHETIC MATCHES' /tmp/model.out
          done

      - name: Scope and deployment warning
        if: always()
        shell: bash
        run: |
          echo 'Negative-only model, no positive F14 decision or E1 listener.'
          echo 'Core9 batch sends GUID evidence only AFTER SendDirectMessage.'
          echo 'No human epoch, creature incarnation, pre-send attribution, session-end source or direct-route token.'
          echo 'No original Core/IP runtime source, Worldserver, SQL/DB/DBC/client, config or owner-host change.'
          echo 'No client ACK, game acceptance, merge, backup, install or deployment.'
