name: F14 paired native role-state fence
on:
  pull_request:
    branches: [feature/codex-f14-leader-view-recovery-20261122]
    paths:
      - src/IndividualProgressionF14GroupSyncView.cpp
      - src/IndividualProgressionF14GroupSyncView.h
      - tests/run_f14_group_view_adapter_test.py
      - tests/test_f14_group_sync_view_source.py
      - .github/workflows/f14-role-state-fence.yml
permissions:
  contents: read
jobs:
  paired-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ip
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: bc2460ea16de7108493d81ef1e5ac54e21bae213
          path: core
          fetch-depth: 2
          persist-credentials: false
      - name: Execute actual Core setters and IP role/quest/session capability matrix
        working-directory: ip
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C ../core rev-parse HEAD)" = bc2460ea16de7108493d81ef1e5ac54e21bae213
          python3 -B ../core/tests/cosmic_role_state_change/run_role_state_change_test.py --compiler '${{ matrix.compiler }}'
          python3 -B -m unittest discover -s ../core/tests/cosmic_role_state_change -p test_role_state_change_source.py -v
          python3 -B tests/run_f14_group_view_adapter_test.py --core ../core --compiler '${{ matrix.compiler }}' --std c++17 --verify-role-parent-fails
          python3 -B tests/run_f14_group_view_adapter_test.py --core ../core --compiler '${{ matrix.compiler }}' --std c++17 --ndebug
          python3 -B tests/run_f14_group_view_adapter_test.py --core ../core --compiler '${{ matrix.compiler }}' --std c++20
          python3 -B -m unittest discover -s tests -p test_f14_group_sync_view_source.py -v
          git diff --check
# Explicit engine/registry/classifier doubles; no server/DB, artifact/cache uploads or activation.
