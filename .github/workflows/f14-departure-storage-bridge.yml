name: F14 departure storage bridge
on:
  push:
    branches:
      - feature/cs01-ip154-f14-departure-storage-bridge-20261112
  pull_request:
    paths:
      - src/IndividualProgressionF14ViewerRestoreProtocol.h
      - src/IndividualProgressionF14OwnedRestoreShards.h
      - src/IndividualProgressionF14CurrentCoreLifecycle.cpp
      - tests/f14_departure_storage_bridge_test.cpp
      - tests/test_f14_departure_storage_bridge_source.py
      - .github/workflows/f14-departure-storage-bridge.yml
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify negative-only source and run focused native models
        run: |
          set -euo pipefail
          python3 tests/test_f14_departure_storage_bridge_source.py
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            for test in f14_reservation_gate_test f14_owned_restore_shards_test f14_current_viewer_session_test f14_departure_storage_bridge_test; do
              ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -pthread "${extra[@]}" -Isrc "tests/$test.cpp" -o "/tmp/$test"
              "/tmp/$test"
            done
            ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror "${extra[@]}" -c src/IndividualProgressionF14CurrentCoreLifecycle.cpp -o /tmp/f14-off.o
          done
