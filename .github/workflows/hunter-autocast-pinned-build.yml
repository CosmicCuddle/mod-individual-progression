name: Hunter IP pinned compatibility build - review only

on:
  push:
    branches: [fix/hunter-autocast-rank-continuity-20261030]
    paths:
      - .github/workflows/hunter-autocast-pinned-build.yml
      - src/IndividualProgressionSpells.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-ip-pinned-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-worldserver-compile:
    name: Historical core + Playerbots + IP candidate + Mod full link
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout historical Grimfeather/Playerbots core (NOT verified installed)
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: b7f06a16ac7120b5abc2e8d3f96a94265a363224
          path: acore
          persist-credentials: false

      - name: Checkout historical pinned Playerbots (NOT verified installed)
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 037c01418b5d01506917a3db9b44fd56ac5f965c
          path: acore/modules/mod-playerbots
          persist-credentials: false

      - name: Checkout EXACT Hunter IP candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: ${{ github.sha }}
          path: acore/modules/mod-individual-progression
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout protected historical Naxxramas module baseline
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false

      - name: Verify exact sources and Hunter source preservation
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = b7f06a16ac7120b5abc2e8d3f96a94265a363224
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = 037c01418b5d01506917a3db9b44fd56ac5f965c
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
          python3 acore/modules/mod-individual-progression/tests/check_hunter_autocast_source.py

      - name: Install build tools in disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure historical full Worldserver with candidate modules
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON

      - name: Prove Hunter modified C++ translation unit is in real build graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = json.loads(Path("acore-build/compile_commands.json").read_text())
          candidate = [
              x for x in commands
              if x.get("file", "").replace("\\", "/").endswith(
                  "/mod-individual-progression/src/IndividualProgressionSpells.cpp"
              )
          ]
          assert len(candidate) == 1, f"Expected 1 IP Hunter translation unit, found {len(candidate)}"
          print("PASS: historical build graph contains exact IP candidate translation unit")
          PY

      - name: Compile and link real Worldserver - do NOT launch it
        run: cmake --build acore-build --target worldserver --parallel 2

      - name: Check resulting executable exists (no release artifact)
        run: |
          set -euo pipefail
          binary=acore-build/src/server/apps/worldserver
          test -s "$binary" && test -x "$binary"
          echo "Source-only pinned compile/link success for IP commit $GITHUB_SHA"
          echo "Historical Mod baseline: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9"
          sha256sum "$binary"
          echo "NOT proof of installed-server compatibility or Hunter gameplay"

      - name: Preserve safety and evidence boundaries
        if: always()
        run: |
          echo "Historical dependency pins; current owner-installed core/IP/Playerbots/modules UNKNOWN"
          echo "No Worldserver launched, no DB configured, no SQL migrated, no config changed, no gameplay tested"
          echo "No binary uploaded, no release, merge, live deployment, or production restart"
          echo "Owner acceptance and test-backup/restore verification remain mandatory"
