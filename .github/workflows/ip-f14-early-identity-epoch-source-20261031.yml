name: IP F14 pre-login identity & boot-epoch source contract (no runtime)
on:
  pull_request:
    paths:
      - .github/workflows/ip-f14-early-identity-epoch-source-20261031.yml
      - tests/test_f14_early_identity_source_contract.py
      - docs/F14_EARLY_IDENTITY_EPOCH_REVIEW_2026-10-31.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-identity-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact IP test source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify three test-only changed paths and parent policy unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=d4ff9374a0b89c42d93e0f57fdc3fc720cfec785
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/ip-f14-early-identity-epoch-source-20261031.yml' \
            'tests/test_f14_early_identity_source_contract.py' \
            'docs/F14_EARLY_IDENTITY_EPOCH_REVIEW_2026-10-31.md' | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
          git diff --check "$BASE" HEAD
          for f in src/IndividualProgression.cpp src/IndividualProgressionPlayer.cpp src/IndividualProgression.h src/cs_individualProgression.cpp src/IndividualProgressionSpells.cpp src/IndividualProgressionGroupPolicy.h src/IndividualProgressionRandomBotStagePolicy.h; do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "$BASE:$f")"
          done
          echo 'PASS: no live code, account/character/SQL/config or compiled source changed'
      - name: Checkout exact historical Playerbots as READ ONLY source
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: historical-playerbots
          persist-credentials: false
      - name: Checkout exact historical AzerothCore as READ ONLY source
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: historical-core
          persist-credentials: false
      - name: Verify frozen source SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C historical-core rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          echo 'PASS: exact historical source versions, not claimed owner installed revisions'
      - name: Run account-type / current-selection / restart / pre-login Python guards
        shell: bash
        run: |
          set -euo pipefail
          PINNED_PLAYERBOTS_ROOT=historical-playerbots \
          PINNED_CORE_ROOT=historical-core \
          PINNED_IP_ROOT=. \
          python3 -m unittest discover -s tests -p 'test_f14_early_identity_source_contract.py' -v
      - name: Safety boundary
        if: always()
        shell: bash
        run: |
          echo 'Source test ONLY. A green run does not mean a typed snapshot exists or a live bot is protected.'
          echo 'No Worldserver launch, deployed binary, bot account write, SQL, registration, gameplay or backup.'

  pinned-native-api-bridge:
    name: Compile-only F14 early selected-RandomBot Playerbots API probe (NO RUNTIME)
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout exact historical AzerothCore Core
        uses: actions/checkout@v4
        with:
          repository: Grimfeather/azerothcore-wotlk
          ref: 8daffdabe9202c228e45d833c9a1d399597a15cd
          path: acore
          persist-credentials: false
      - name: Checkout exact historical Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: e88cc4099e69f35126b28942a412ca702d20453b
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout current F14 research IP candidate WITHOUT changing PR source
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: tests/f14-early-identity-epoch-contract-20261031
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout exact historical Naxx custom module
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Verify frozen compilation sources and Hunter/group executable bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 8daffdabe9202c228e45d833c9a1d399597a15cd
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = e88cc4099e69f35126b28942a412ca702d20453b
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 80e9de1c39a6dc995188a80c31a5e785d0f2a6f9
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD:src/IndividualProgressionPlayer.cpp)" = 47873c2e4b097190d88a9b30416cce83a0fcac2e
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD:src/IndividualProgressionSpells.cpp)" = 6ee93e1174b5aef6c5d61c9ea31526506c9d08da
          echo 'PASS: original IP and PB executable code untouched in GitHub; only disposable overlay follows'
      - name: Apply EXACT two earlier historical Playerbots compiler patches on runner ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('acore/modules/mod-playerbots')
          patches = {
            'src/Db/PlayerbotsDatabase.h': (
              'MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,',
              'MySQLConnection* CreateConnection(ProducerConsumerQueue<SQLOperation*>* queue,'
            ),
            'src/Util/LocaleColumns.h': (
              'if (!IsLocaleRegistered(locale))', 'if (!localeNames[locale])'
            )
          }
          for file, (before, after) in patches.items():
            p = root / file
            source = p.read_text()
            assert source.count(before) == 1, file
            assert after not in source, file
            p.write_text(source.replace(before, after))
          PY
          git -C acore/modules/mod-playerbots diff --check
          git -C acore/modules/mod-playerbots diff --name-only | sort > /tmp/pb-actual.txt
          printf '%s\n' 'src/Db/PlayerbotsDatabase.h' 'src/Util/LocaleColumns.h' | sort > /tmp/pb-allowed.txt
          diff -u /tmp/pb-allowed.txt /tmp/pb-actual.txt
      - name: Temporarily insert read-only PB predicate reference before IP bot login stage write
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ip = Path('acore/modules/mod-individual-progression/src/IndividualProgressionPlayer.cpp')
          s = ip.read_text()
          old_include = '#include "IndividualProgressionGroupPolicy.h"'
          assert s.count(old_include) == 1
          s = s.replace(old_include, old_include + '\n#include "../../mod-playerbots/src/Bot/RandomPlayerbotMgr.h"')
          target = '        if (!sIndividualProgression->isNormalAccount(player)) // bot or exluded account'
          assert s.count(target) == 1
          probe = (
            '        // CI ONLY: compile/link Playerbots current-selected GUID lookup; no game writes.\n'
            '        bool const ciObservedSelectedRandomBot = player->GetSession() &&\n'
            '            player->GetSession()->IsHeadless() &&\n'
            '            sRandomPlayerbotMgr.IsRandomBot(player->GetGUID().GetCounter());\n'
            '        (void)ciObservedSelectedRandomBot;\n'
          )
          s = s.replace(target, probe + target)
          ip.write_text(s)
          PY
          git -C acore/modules/mod-individual-progression diff --check
          git -C acore/modules/mod-individual-progression diff --name-only > /tmp/ip-changes.txt
          printf '%s\n' 'src/IndividualProgressionPlayer.cpp' > /tmp/ip-allowed.txt
          diff -u /tmp/ip-allowed.txt /tmp/ip-changes.txt
          echo 'PASS: exactly one CI-only C++ probe, no marker/achievement/login behavior modified'
      - name: Install C++ build dependencies on isolated GitHub runner ONLY
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Configure fully pinned Worldserver with exact historical modules
        shell: bash
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Check IP login with Playerbots read-only probe is in native compilation graph
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('acore-build/compile_commands.json').read_text())
          wanted = ('/mod-individual-progression/src/IndividualProgressionPlayer.cpp')
          units = [i for i in data if i.get('file', '').replace('\\', '/').endswith(wanted)]
          assert len(units) == 1, f'Expected exactly one compiled IP login TU; found {len(units)}'
          print('PASS: native worldserver compile graph includes one test-only Playerbots probe')
          PY
      - name: Compile and link full Worldserver with read-only F14 identity API probe (NEVER LAUNCH)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify linked executable exists; NEVER publish or deploy
        shell: bash
        run: |
          set -euo pipefail
          test -s acore-build/src/server/apps/worldserver
          test -x acore-build/src/server/apps/worldserver
          echo 'PASS: API include and link are compatible in frozen historical Core/Playerbots/IP/Naxx stack'
          echo 'No compiled probe committed to PR, no positive TBC eligibility, no stage or visibility behavior implemented'
      - name: Owner-host safety notice
        if: always()
        run: |
          echo 'CI runner is disposable and NOT CosmicCuddle live host.'
          echo 'Test-only read never executed by starting a Worldserver.'
          echo 'Two historical Playerbots patches and one IP C++ lookup probe exist ONLY in runner.'
          echo 'No SQL, config, gameplay, character, client, server startup, backup, merge, upload or deployment.'
          echo 'Real installed source, world-thread safety and TBC eligibility need later review.'
