name: F14 retained uncertainty review model
on:
  push:
    branches:
      - fix/cs01-ip151-f14-retained-uncertainty-review-20261112
  pull_request:
    paths:
      - src/IndividualProgressionF14ReservationGate.h
      - src/IndividualProgressionF14OwnedRestoreShards.h
      - tests/f14_reservation_gate_test.cpp
      - tests/f14_owned_restore_shards_test.cpp
      - .github/workflows/f14-retained-uncertainty-review.yml
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute both corrected models
        run: |
          set -euo pipefail
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            for test in f14_reservation_gate_test f14_owned_restore_shards_test; do
              ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror -pthread "${extra[@]}" -Isrc "tests/$test.cpp" -o "/tmp/$test"
              "/tmp/$test"
            done
          done
