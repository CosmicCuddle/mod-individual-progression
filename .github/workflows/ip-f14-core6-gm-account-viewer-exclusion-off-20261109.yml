name: IP F14 Core6 source GM-account observer exclusion (OFF)

on:
  push:
    branches:
      - fix/cs01-ip138-f14-gm-account-viewer-exclusion-20261109
  pull_request:
    branches:
      - feature/cs01-ip137-f14-core6-positive-rndbot-policy-off-20261109

permissions:
  contents: read

jobs:
  gm-account-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact isolated child and original green IP138
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert strict four-path scope and frozen original IP138 source
        shell: bash
        run: |
          set -euo pipefail
          base=a8d92ce4c867e53e6337765783956ce4f65e7022
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort >/tmp/actual
          printf '%s\n' \
            '.github/workflows/ip-f14-core6-gm-account-viewer-exclusion-off-20261109.yml' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'src/IndividualProgressionF14Core6PositiveRndbotAdapter.h' \
            'tests/test_ip_f14_core6_positive_rndbot_adapter_source.py' \
            | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$base" HEAD -- conf data sql src/IndividualProgression.cpp src/IndividualProgression.h src/IndividualProgressionPlayer.cpp)"
          test "$(git rev-parse HEAD:src/IndividualProgressionPlayer.cpp)" = \
               "$(git rev-parse "$base":src/IndividualProgressionPlayer.cpp)"
          test "$(git rev-parse HEAD:src/IndividualProgressionF14Core6PositiveRndbotViewerPolicy.h)" = \
               "$(git rev-parse "$base":src/IndividualProgressionF14Core6PositiveRndbotViewerPolicy.h)"
          grep -Fqx 'IndividualProgression.F14.ExperimentalRndbotPlayerVisibility = 0' conf/individualProgression.conf.dist

      - name: New actual source old-RED/new-GREEN security and IP GM guard test
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests \
            -p test_ip_f14_core6_positive_rndbot_adapter_source.py -v

      - name: Frozen positive-policy, login and stage C++/source regressions
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            for standard in c++17 c++20; do
              for mode in normal ndebug; do
                flags=()
                if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
                "$compiler" -std="$standard" -O2 -Wall -Wextra -Werror -pedantic "${flags[@]}" \
                  tests/f14_core6_positive_rndbot_viewer_policy.cpp \
                  -o /tmp/f14-viewer-account-guard
                /tmp/f14-viewer-account-guard
              done
            done
          done
          for test in \
            test_ip_f14_stage8_invalid_cap_native.py \
            test_ip_f14_optin_publication_login_predicate.py \
            test_ip_f14_actor_publication_reload_generation_source.py \
            test_ip_f14_group_floor_source.py; do
            python3 -B -m unittest discover -s tests -p "$test" -v
          done

      - name: Confidence and owner boundary
        if: always()
        run: |
          echo 'Source-only GM/administrator observer safety: GM mode OFF is NOT normal-human proof.'
          echo 'IP138 baseline, original Core6 negative adapter, paid/quest/loot and every config remain untouched.'
          echo 'NO Worldserver native compilation, real viewer packet, online GMs, client ACK, or gameplay test.'
          echo 'The new optional positive adapter remains forced OFF by the required genuine Core refresh ABI.'
          echo 'No merge, production server, backup, SQL/DB, DBC/client or owner host changes.'
